      const src = this.ctx.createMediaStreamSource(this.stream);
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 1024;
      this.buf = new Float32Array(this.analyser.fftSize);
      src.connect(this.analyser);
    } catch (e) { this.analyser = null; }
    return this.stream;
  },
  /* Lautstärke 0 bis 1 */
  level() {
    if (!this.analyser) return 0;
    try { if (this.ctx.state === "suspended") this.ctx.resume(); } catch (e) {}
    this.analyser.getFloatTimeDomainData(this.buf);
    let s = 0;
    for (let i = 0; i < this.buf.length; i++) s += this.buf[i] * this.buf[i];
    return Math.min(1, Math.sqrt(s / this.buf.length) * 6);
  },
  /* ---------- Aufnahme der ganzen Session ---------- */
  recording() { return !!(this.rec && this.rec.state === "recording"); },
  startRecording() {
    if (!this.stream || this.recording() || typeof MediaRecorder === "undefined") return false;
    const types = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus", "audio/webm"];
    this.mime = types.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } }) || "";
    try { this.rec = new MediaRecorder(this.stream, this.mime ? { mimeType: this.mime } : undefined); } catch (e) { this.rec = null; return false; }
    this.chunks = [];
    this.rec.ondataavailable = (e) => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.rec.start(1000);
    this.recStart = Date.now();
    RecDot.show(true);
    return true;
  },
  stopRecording() {
    return new Promise(resolve => {
      RecDot.show(false);
      if (!this.rec) { resolve(null); return; }
      const rec = this.rec;
      this.rec = null;
      const done = () => {
        const type = (rec.mimeType || this.mime || "audio/webm").split(";")[0];
        resolve(this.chunks.length ? { blob: new Blob(this.chunks, { type }), secs: Math.round((Date.now() - this.recStart) / 1000), type } : null);
      };
      if (rec.state === "inactive") { done(); return; }
      rec.onstop = done;
      try { rec.stop(); } catch (e) { done(); }
    });
  },
  close() {
    this.stopRecognition();
    if (this.rec) { try { this.rec.stop(); } catch (e) {} this.rec = null; RecDot.show(false); }
    if (this.stream) { this.stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); this.stream = null; }
    if (this.ctx) { try { this.ctx.close(); } catch (e) {} this.ctx = null; this.analyser = null; }
  },
  /* ---------- Spracherkennung ---------- */
  startRecognition(lang, onText, opts = {}) {
    this.stopRecognition();
    if (!this.recognitionAvailable()) return false;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let r;
    try { r = new SR(); } catch (e) { this.recoBroken = true; return false; }
    r.lang = lang === "en" ? "en-US" : "de-DE";
    r.continuous = !!opts.continuous;
    r.interimResults = !!opts.interim;
    r.maxAlternatives = 3;
    r.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        const alts = Array.from(res).map(x => x.transcript);
        try { onText(alts, res.isFinal); } catch (err) {}
      }
    };
    /* Bei echten Fehlern (kein Netz, kein Zugriff) aufhören, nur Stille ist kein Fehler */
    r.onerror = (e) => { const err = (e && e.error) || ""; if (err !== "no-speech" && err !== "aborted") { this.recoBroken = true; this.recoWant = false; } };
    const starts = [];
    r.onend = () => {
      if (!this.recoWant || this.reco !== r) return;
      const now = Date.now();
      starts.push(now);
      while (starts.length && now - starts[0] > 10000) starts.shift();
      if (starts.length > 6) { this.recoBroken = true; this.recoWant = false; return; }
      setTimeout(() => { if (this.recoWant && this.reco === r) { try { r.start(); } catch (err) { this.recoWant = false; } } }, 250);
    };
    this.reco = r;
    this.recoWant = true;
    try { r.start(); } catch (e) { this.recoWant = false; return false; }
    return true;
  },
  stopRecognition() {
    this.recoWant = false;
    const r = this.reco;
    this.reco = null;
    if (r) { try { r.onend = null; r.abort(); } catch (e) {} }
  }
};

/* Aus gesprochenen Worten eine Antwort machen: 1, 2 oder 3 */
const VOICE_NUM = { eins: 1, ein: 1, einmal: 1, one: 1, once: 1, "1": 1, zwei: 2, zweimal: 2, two: 2, twice: 2, "2": 2, drei: 3, dreimal: 3, three: 3, "3": 3 };
function voiceToTaps(kind, text) {
  const t = String(text || "").toLowerCase().replace(/[^\p{L}\p{N} ]+/gu, " ");
  const words = t.split(/\s+/).filter(Boolean);
  for (const w of words) if (VOICE_NUM[w]) return VOICE_NUM[w];
  const has = (re) => re.test(t);
  if (kind === "tiefe") {
    if (has(/\b(ganz tief|sehr tief|tief|deep)\b/)) return 3;
    if (has(/\b(entspannt|relaxed)\b/)) return 2;
    if (has(/\b(wach|awake)\b/)) return 1;
  }
  if (kind === "ende") {
    if (has(/\b(beenden|aufhören|stopp|stop|end|beende)\b/)) return 2;
    if (has(/\b(weiter|weitermachen|continue|go on)\b/)) return 1;
  }
  if (kind === "bereit" && has(/\b(bleiben|stay|noch nicht|not yet)\b/)) return 2;
  if (has(/\b(nein|nö|no|nope|nicht)\b/)) return 2;
  if (has(/\b(ja|jo|jep|genau|yes|yeah|yep|yup)\b/)) return 1;
  return 0;
}
/* Wie viel vom Satz wurde gesagt? 0 bis 1 */
function sentenceMatch(target, said) {
  const norm = (x) => String(x).toLowerCase().replace(/[^\p{L}\p{N} ]+/gu, " ").split(/\s+/).filter(w => w.length > 1);
  const a = norm(target), b = new Set(norm(said));
  if (!a.length) return 0;
  return a.filter(w => b.has(w)).length / a.length;
}

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "value") el.value = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

/* ---------- Speicher für Sessions ---------- */
const LOCAL_KEY = "tiefgang.sessions.v1";
const Store = {
  mode: "pending", col: null, mem: [], ready: null,
  init() {
    this.ready = (async () => {
      try {
        const [db, user] = await Promise.all([Caps.db, Caps.user]);
        if (db && user && typeof user.id === "function") {
          const id = await user.id();
          if (id) { this.col = db.collection("data/users/" + id); this.mode = "db"; return; }
        }
      } catch (e) {}
      this.mode = LS.set("tiefgang.probe", 1) ? "local" : "memory";
    })();
    return this.ready;
  },
  localList() { return this.mode === "memory" ? this.mem.slice() : LS.get(LOCAL_KEY, []); },
  async list() {
    await this.ready;
    let remote = [];
    if (this.mode === "db") {
      try {
        const snap = await withTimeout(this.col.where("kind", "==", "session").orderBy("createdAt", "desc").limit(60).get(), 10000);
        remote = snap.docs.map(d => d.data()).filter(x => x && x.script);
      } catch (e) { this.listError = true; }
    }
    const seen = new Set(remote.map(x => x.id));
    return [...remote, ...this.localList().filter(x => x && !seen.has(x.id))].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  },
  async save(s) {
    await this.ready;
    const body = JSON.parse(JSON.stringify(s));
    if (this.mode === "db") {
      try { await this.col.doc(s.id).set(body); return "db"; }
      catch (e) {
        if (e && e.code === "unavailable") {
          try { await sleep(700 + Math.random() * 800); await this.col.doc(s.id).set(body); return "db"; } catch (e2) {}
        }
        if (e && e.code === "quota_exceeded") return "full";
      }
    }
    const list = this.localList().filter(x => x.id !== s.id);
    list.unshift(body);
    if (this.mode !== "memory" && LS.set(LOCAL_KEY, list.slice(0, 20))) return "local";
    this.mem = list.slice(0, 20);
    return "memory";
  },
  async remove(id) {
    await this.ready;
    if (this.mode === "db") { try { await this.col.doc(id).delete(); } catch (e) {} }
    const list = this.localList().filter(x => x.id !== id);
    if (this.mode === "memory") this.mem = list; else LS.set(LOCAL_KEY, list);
  },
  note() {
    if (this.mode === "db") return "Gespeichert in deinem Claude-Konto. Nur du siehst sie.";
    if (this.mode === "local") return "Gespeichert in diesem Browser.";
    return "Nur gespeichert, bis du die Seite schließt. Lade dir das Skript herunter, wenn du es behalten willst.";
  }
};

const stepVisible = (i) => { const s = STEPS[i]; return !!s && (!s.when || s.when(state.answers)); };
const visibleSteps = () => STEPS.map((_, i) => i).filter(stepVisible);
const nextVisible = (i) => { for (let k = i + 1; k < STEPS.length; k++) if (stepVisible(k)) return k; return -1; };
const prevVisible = (i) => { for (let k = i - 1; k >= 0; k--) if (stepVisible(k)) return k; return -1; };
const isLastStep = () => nextVisible(state.step) === -1;

/* ---------- Atmendes Licht ---------- */
const easeCos = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x, 0, 1));
const Orb = {
  canvas: null, ctx: null, raf: 0, speak: 0, target: 0, reduced: false, specks: [], mode: "licht", period: 10, t0: 0,
  attach(c, mode) {
    this.canvas = c;
    this.ctx = c.getContext("2d");
    this.mode = mode || "licht";
    this.reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.size();
    if (!this.specks.length) {
      for (let i = 0; i < 18; i++) this.specks.push({ a: Math.random() * Math.PI * 2, r: 0.2 + Math.random() * 0.75, s: (0.2 + Math.random() * 0.6) * (Math.random() < 0.5 ? -1 : 1), z: Math.random() });
    }
    cancelAnimationFrame(this.raf);
    const loop = (t) => {
      if (!this.canvas) return;
      this.draw(t);
      if (!this.reduced) this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },
  setMode(m) { this.mode = m || "licht"; if (this.reduced && this.canvas) this.draw(4000); },
  size() {
    if (!this.canvas) return;
    const r = this.canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.canvas.width = Math.max(1, Math.round(r.width * dpr));
    this.canvas.height = Math.max(1, Math.round(r.height * dpr));
    if (this.reduced) this.draw(4000);
  },
  detach() { cancelAnimationFrame(this.raf); this.raf = 0; this.canvas = null; this.ctx = null; },
  /* Atemrhythmus: Standard 10 s, nach der Atem-Kopplung der eigene Rhythmus */
  setPeriod(sec) {
    this.period = sec > 0 ? clamp(sec, 3, 14) : 10;
    this.t0 = performance.now();
    try { document.documentElement.style.setProperty("--breath", this.period.toFixed(2) + "s"); } catch (e) {}
  },
  breath(t) {
    const per = this.period || 10, inhale = per * 0.4;
    const p = this.reduced ? inhale : (((t - this.t0) / 1000) % per + per) % per;
    return p < inhale ? easeCos(p / inhale) : 1 - easeCos((p - inhale) / (per - inhale));
  },
  halo(c, cx, cy, r, m, glow) {
    const g = c.createRadialGradient(cx, cy, r * 0.2, cx, cy, Math.max(r * 3.6, m * 0.7));
    g.addColorStop(0, `rgba(243,168,111,${0.3 * glow})`);
    g.addColorStop(0.35, `rgba(186,102,60,${0.12 * glow})`);
    g.addColorStop(1, "rgba(19,14,12,0)");
    c.fillStyle = g;
    c.fillRect(0, 0, this.canvas.width, this.canvas.height);
  },
  glowBall(c, x, y, r, glow) {
    const g = c.createRadialGradient(x, y - r * 0.15, 0, x, y, r);
    g.addColorStop(0, `rgba(255,241,226,${Math.min(1, 0.95 * glow)})`);
    g.addColorStop(0.45, `rgba(246,178,122,${Math.min(1, 0.85 * glow)})`);
    g.addColorStop(1, "rgba(243,168,111,0)");
    c.fillStyle = g;
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fill();
  },
  draw(t) {
    const c = this.ctx, W = this.canvas.width, H = this.canvas.height;
    if (!W || !H) return;
    c.clearRect(0, 0, W, H);
    this.speak += (this.target - this.speak) * 0.04;
    const b = this.breath(t);
    const fn = { spirale: this.drawSpiral, pendel: this.drawPendulum, uhr: this.drawWatch, kristall: this.drawCrystal, keine: this.drawNone }[this.mode] || this.drawLight;
    fn.call(this, c, W, H, t, b);
  },
  drawNone(c, W, H, t, b) {
    const cx = W / 2, cy = H / 2, m = Math.min(W, H);
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, m * 0.35);
    g.addColorStop(0, `rgba(243,168,111,${0.05 + 0.04 * b + 0.05 * this.speak})`);
    g.addColorStop(1, "rgba(19,14,12,0)");
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
  },
  drawLight(c, W, H, t, b) {
    const cx = W / 2, cy = H / 2, m = Math.min(W, H), base = m * 0.2;
    const r = base * (0.8 + 0.28 * b);
    const glow = 0.6 + 0.25 * b + 0.22 * this.speak;
    this.halo(c, cx, cy, r, m, glow);
    const sec = t / 1000;
    for (const s of this.specks) {
      const ang = s.a + (this.reduced ? 0 : sec * 0.035 * s.s);
      const rr = base * 1.3 + s.r * m * 0.42;
      const x = cx + Math.cos(ang) * rr * 1.6, y = cy + Math.sin(ang) * rr * 0.62;
      const a = (0.05 + 0.12 * s.z) * (0.55 + 0.45 * Math.sin(sec * 0.45 + s.a * 3));
      c.fillStyle = `rgba(245,196,158,${Math.max(0, a)})`;
      c.beginPath();
      c.arc(x, y, (0.8 + s.z * 1.6) * (m / 220), 0, Math.PI * 2);
      c.fill();
    }
    this.glowBall(c, cx, cy, r, glow);
  },
  drawSpiral(c, W, H, t, b) {
    const cx = W / 2, cy = H / 2, m = Math.min(W, H);
    const R = m * 0.46;
    const rot = this.reduced ? 0 : (t / 1000) * 0.9;
    const glow = 0.55 + 0.2 * b + 0.2 * this.speak;
    this.halo(c, cx, cy, m * 0.12, m, glow * 0.8);
    c.save();
    c.translate(cx, cy);
    c.lineCap = "round";
    const turns = 4.2, steps = 260;
    for (let arm = 0; arm < 2; arm++) {
      c.beginPath();
      for (let i = 0; i <= steps; i++) {
        const f = i / steps;
        const th = f * turns * Math.PI * 2 + arm * Math.PI - rot;
        const rr = f * R;
        const x = Math.cos(th) * rr, y = Math.sin(th) * rr;
        if (i) c.lineTo(x, y); else c.moveTo(x, y);
      }
      const grad = c.createRadialGradient(0, 0, 0, 0, 0, R);
      grad.addColorStop(0, `rgba(255,236,214,${0.95 * glow})`);
      grad.addColorStop(0.5, `rgba(243,168,111,${0.75 * glow})`);
      grad.addColorStop(1, "rgba(243,168,111,0)");
      c.strokeStyle = grad;
      c.lineWidth = m * (arm ? 0.022 : 0.034);
      c.stroke();
    }
    c.restore();
    this.glowBall(c, cx, cy, m * (0.05 + 0.015 * b), glow);
  },
  swing(t) { return this.reduced ? 0.25 : Math.sin((t / 1000) * Math.PI * 2 / 4); },
  drawPendulum(c, W, H, t, b, watch) {
    const m = Math.min(W, H);
    const px = W / 2, py = H * 0.05;
    const L = H * (watch ? 0.6 : 0.68);
    const A = 0.42;
    const glow = 0.6 + 0.2 * b + 0.2 * this.speak;
    const pos = (ang) => [px + Math.sin(ang) * L, py + Math.cos(ang) * L];
    const ang = A * this.swing(t);
    if (!this.reduced) {
      for (let k = 6; k >= 1; k--) {
        const [gx, gy] = pos(A * this.swing(t - k * 45));
        c.fillStyle = `rgba(243,168,111,${0.035 * (7 - k)})`;
        c.beginPath();
        c.arc(gx, gy, m * (watch ? 0.1 : 0.06), 0, Math.PI * 2);
        c.fill();
      }
    }
    const [x, y] = pos(ang);
    c.strokeStyle = watch ? "rgba(214,170,120,0.55)" : "rgba(242,230,219,0.4)";
    c.lineWidth = Math.max(1, m * 0.006);
    if (watch) c.setLineDash([m * 0.012, m * 0.008]);
    c.beginPath(); c.moveTo(px, py); c.lineTo(x, y - (watch ? m * 0.11 : 0)); c.stroke();
    c.setLineDash([]);
    c.fillStyle = "rgba(242,230,219,0.5)";
    c.beginPath(); c.arc(px, py, m * 0.012, 0, Math.PI * 2); c.fill();
    if (!watch) {
      const g = c.createRadialGradient(x, y, 0, x, y, m * 0.3);
      g.addColorStop(0, `rgba(243,168,111,${0.28 * glow})`);
      g.addColorStop(1, "rgba(19,14,12,0)");
      c.fillStyle = g;
      c.fillRect(0, 0, W, H);
      this.glowBall(c, x, y, m * 0.075, glow);
      return;
    }
    const r = m * 0.1;
    c.save();
    c.translate(x, y);
    c.rotate(-ang * 0.6);
    const halo = c.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 2.6);
    halo.addColorStop(0, `rgba(243,168,111,${0.22 * glow})`);
    halo.addColorStop(1, "rgba(19,14,12,0)");
    c.fillStyle = halo;
    c.beginPath(); c.arc(0, 0, r * 2.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#d29a62";
    c.beginPath(); c.arc(0, -r * 1.08, r * 0.14, 0, Math.PI * 2); c.fill();
    const face = c.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    face.addColorStop(0, "#3a2a22");
    face.addColorStop(1, "#1c1411");
    c.fillStyle = face;
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = `rgba(243,168,111,${0.85 * glow + 0.1})`;
    c.lineWidth = r * 0.09;
    c.stroke();
    c.strokeStyle = "rgba(242,230,219,0.6)";
    c.lineWidth = r * 0.03;
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const r1 = r * (i % 3 === 0 ? 0.68 : 0.76), r2 = r * 0.84;
      c.beginPath(); c.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); c.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); c.stroke();
    }
    const sec = t / 1000;
    const hand = (a, len, w) => { c.lineWidth = w; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.sin(a) * len, -Math.cos(a) * len); c.stroke(); };
    c.strokeStyle = "rgba(242,230,219,0.85)";
    c.lineCap = "round";
    hand(this.reduced ? 1.9 : sec * 0.02, r * 0.45, r * 0.06);
    hand(this.reduced ? 0.5 : sec * 0.24, r * 0.66, r * 0.04);
    c.fillStyle = "#f3a86f";
    c.beginPath(); c.arc(0, 0, r * 0.06, 0, Math.PI * 2); c.fill();
    const gl = c.createLinearGradient(-r, -r, r, r);
    gl.addColorStop(0.3, "rgba(255,255,255,0)");
    gl.addColorStop(0.45, `rgba(255,240,225,${0.1 + 0.08 * Math.abs(Math.sin(ang * 3))})`);
    gl.addColorStop(0.6, "rgba(255,255,255,0)");
    c.fillStyle = gl;
    c.beginPath(); c.arc(0, 0, r * 0.92, 0, Math.PI * 2); c.fill();
    c.restore();
  },
  drawWatch(c, W, H, t, b) { this.drawPendulum(c, W, H, t, b, true); },
  drawCrystal(c, W, H, t, b) {
    const cx = W / 2, cy = H / 2, m = Math.min(W, H);
    const glow = 0.6 + 0.22 * b + 0.2 * this.speak;
    this.halo(c, cx, cy, m * 0.12, m, glow);
    const R = m * 0.24;
    const rot = this.reduced ? 0.6 : (t / 1000) * 0.25;
    const n = 6;
    const outer = [], inner = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rot;
      const sx = Math.cos(a), sy = Math.sin(a);
      outer.push([cx + sx * R, cy + sy * R * 1.25]);
      inner.push([cx + Math.cos(a + Math.PI / n) * R * 0.48, cy + Math.sin(a + Math.PI / n) * R * 0.6]);
    }
    for (let i = 0; i < n; i++) {
      const [x1, y1] = outer[i], [x2, y2] = outer[(i + 1) % n], [ix, iy] = inner[i];
      const shade = 0.08 + 0.18 * (0.5 + 0.5 * Math.cos(rot * 2 + i * 1.3));
      c.fillStyle = `rgba(243,168,111,${shade * glow})`;
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineTo(ix, iy); c.closePath(); c.fill();
      c.fillStyle = `rgba(255,236,214,${shade * 0.6 * glow})`;
      c.beginPath(); c.moveTo(ix, iy); c.lineTo(cx, cy); c.lineTo(x2, y2); c.closePath(); c.fill();
    }
    c.strokeStyle = `rgba(255,236,214,${0.55 * glow})`;
    c.lineWidth = Math.max(1, m * 0.004);
    c.beginPath(); outer.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.stroke();
    c.beginPath(); inner.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.stroke();
    for (let i = 0; i < n; i++) { c.beginPath(); c.moveTo(outer[i][0], outer[i][1]); c.lineTo(inner[i][0], inner[i][1]); c.stroke(); }
    const sec = t / 1000;
    for (let i = 0; i < n; i++) {
      const tw = this.reduced ? 0.4 : Math.max(0, Math.sin(sec * 1.1 + i * 2.1));
      if (tw < 0.2) continue;
      const [x, y] = outer[i];
      const s = m * 0.03 * tw;
      c.strokeStyle = `rgba(255,246,235,${0.8 * tw})`;
      c.lineWidth = Math.max(1, m * 0.004);
      c.beginPath(); c.moveTo(x - s, y); c.lineTo(x + s, y); c.moveTo(x, y - s); c.lineTo(x, y + s); c.stroke();
    }
  }
};

/* ---------- Tiefenprofil ---------- */
function depthChartSVG(phases, o = {}) {
  const mini = !!o.mini;
  const W = Math.max(260, Math.round(o.w || 360));
  const H = mini ? 58 : 176;
  const padL = mini ? 6 : 42, padR = mini ? 8 : 14, padT = mini ? 9 : 16, padB = mini ? 9 : 30;
  const iw = W - padL - padR, ih = H - padT - padB;
  const ph = (phases || []).filter(p => p && p.minutes > 0);
  const total = ph.reduce((s, p) => s + p.minutes, 0) || 1;
  const X = (m) => padL + (m / total) * iw;
  const Y = (d) => padT + (clamp(Number(d) || 0, 0, 10) / 10) * ih;
  const pts = [[0, 0]];
  const mids = [];
  let acc = 0;
  ph.forEach((p, i) => { const mid = acc + p.minutes / 2; pts.push([mid, p.depth]); mids.push({ m: mid, d: p.depth, i }); acc += p.minutes; });
  pts.push([total, ph.length ? ph[ph.length - 1].depth : 0]);
  const f = (m) => {
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
      if (m <= x1 || i === pts.length - 2) {
        const t = x1 > x0 ? clamp((m - x0) / (x1 - x0), 0, 1) : 1;
        return y0 + (y1 - y0) * t * t * (3 - 2 * t);
      }
    }
    return 0;
  };
  const path = (m0, m1) => {
    const N = 120;
    let d = "";
    for (let k = 0; k <= N; k++) { const m = m0 + (m1 - m0) * k / N; d += (k ? "L" : "M") + X(m).toFixed(1) + " " + Y(f(m)).toFixed(1); }
    return d;
  };
  const gid = "dg" + Math.random().toString(36).slice(2, 8);
  const full = path(0, total);
  let s = `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "Verlauf der Trancetiefe über die Zeit")}">`;
  s += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3a86f" stop-opacity="0.03"/><stop offset="1" stop-color="#f3a86f" stop-opacity="0.24"/></linearGradient></defs>`;
  s += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  if (!mini) {
    s += `<line class="grid dash" x1="${padL}" x2="${W - padR}" y1="${Y(5)}" y2="${Y(5)}"/><line class="grid dash" x1="${padL}" x2="${W - padR}" y1="${Y(10)}" y2="${Y(10)}"/>`;
    s += `<text x="${padL - 8}" y="${Y(0) + 4}" text-anchor="end">wach</text><text x="${padL - 8}" y="${Y(10) + 4}" text-anchor="end">tief</text>`;
    const step = total <= 12 ? 2 : 5;
    for (let m = 0; m <= total + 0.01; m += step) {
      const last = m + step > total + 0.01;
      s += `<text x="${X(m).toFixed(1)}" y="${H - 8}" text-anchor="${m === 0 ? "start" : last && total - m < 1.5 ? "end" : "middle"}">${m}${last ? " Min" : ""}</text>`;
    }
  }
  s += `<path d="${full} L${X(total).toFixed(1)} ${Y(0)} L${X(0)} ${Y(0)} Z" fill="url(#${gid})"/>`;
  if (o.progress != null) {
    const pm = clamp(o.progress, 0, 1) * total;
    s += `<path class="curve ghost" d="${full}"/>`;
    if (pm > 0) s += `<path class="curve" d="${path(0, pm)}"/>`;
    s += `<circle class="nowring" cx="${X(pm).toFixed(1)}" cy="${Y(f(pm)).toFixed(1)}" r="7"/><circle class="now" cx="${X(pm).toFixed(1)}" cy="${Y(f(pm)).toFixed(1)}" r="4.5"/>`;
  } else {
    s += `<path class="curve" d="${full}"/>`;
  }
  if (o.markers) {
    for (const mk of mids) s += `<g class="mk"><circle cx="${X(mk.m).toFixed(1)}" cy="${Y(mk.d).toFixed(1)}" r="10"/><text x="${X(mk.m).toFixed(1)}" y="${Y(mk.d).toFixed(1)}">${mk.i + 1}</text></g>`;
  }
  return s + "</svg>";
}

function drawCharts() {
  document.querySelectorAll("[data-chart]").forEach(el => {
    if (!el._phases) return;
    el.innerHTML = depthChartSVG(el._phases, { w: el.clientWidth, markers: true });
  });
}

/* ---------- Skript als Text ---------- */
function scriptToNodes(text, onSeek) {
  const frag = document.createDocumentFragment();
  const lines = String(text || "").split("\n").map(l => l.trim()).filter(Boolean);
  let sec = lines.length && /^#/.test(lines[0]) ? -1 : 0;
  for (const line of lines) {
    const m = line.match(/^#{1,6}\s*(.+)$/);
    if (m) {
      sec++;
      const title = m[1].replace(/\(\s*(?:Tiefe|Depth)[^)]*\)\s*$/i, "").replace(/[*_`]+/g, "").trim();
      const i = sec;

function ensureEnding(script, answers, truncated) {

async function askJson(sample, prompt, opts) {

const pauseMs = (ms) => new Promise(r => setTimeout(r, ms));
async function translateLines(list, sample, signal, onProgress) {
  const map = new Map();
  const uniq = [];
  for (const raw of list) {
    const s = String(raw || "").trim();
    if (!s || map.has(s) || uniq.includes(s)) continue;
    const f = fixedEn(s);
    if (f) map.set(s, f); else uniq.push(s);
  }
  const chunks = [];
  let cur = [], size = 0;
  for (const s of uniq) {
    if (cur.length && (cur.length >= 45 || size + s.length > 4500)) { chunks.push(cur); cur = []; size = 0; }
    cur.push(s); size += s.length;
  }
  if (cur.length) chunks.push(cur);
  let done = 0;
  const one = async (chunk, depth) => {
    let x;
    try { x = await askJson(sample, linesPrompt(chunk), { signal, modelTier: "default" }); }
    catch (e) {
      if (signal && signal.aborted) throw e;
      if (e && e.code === "rate_limited" && depth < 2) { await pauseMs(4000); return one(chunk, depth + 1); }
      if (depth < 1 && e && /invalid_json|empty|incomplete/.test(String(e.code || ""))) return one(chunk, depth + 1);
      throw e;
    }
    const out = Array.isArray(x) ? x : (x && Array.isArray(x.lines) ? x.lines : null);
    if (!out || out.length !== chunk.length) {
      if (depth < 3 && chunk.length > 1) { const hlf = Math.ceil(chunk.length / 2); await one(chunk.slice(0, hlf), depth + 1); await one(chunk.slice(hlf), depth + 1); return; }
      throw { code: "incomplete" };
    }
    chunk.forEach((s, i) => map.set(s, fixPlaceholders(s, out[i])));
    done += chunk.length;
    if (onProgress) onProgress(uniq.length ? done / uniq.length : 1);
  };

  const worker = async () => { while (next < chunks.length) { const c = chunks[next++]; await one(c, 0); } };
  await Promise.all(Array.from({ length: Math.min(2, chunks.length) }, worker));
  return (s) => { const t = String(s || "").trim(); return map.has(t) ? map.get(t) : s; };
}

  lines.forEach(l => { const m = l.match(HEAD_RE); if (m) texts.push(m[1]); else if (spoken(l)) texts.push(l); });
  const T = await translateLines(texts, sample, signal, onProgress);
  return lines.map(l => { const m = l.match(HEAD_RE); if (m) return `# ${T(m[1])}${m[2] ? " " + m[2] : ""}`; return spoken(l) ? T(l) : l; }).join("\n");
}

  const opts = { signal: ctl.signal, modelTier: "default", onText: ({ text }) => updateStream(text) };
  if (regenerate) opts.cache = false;
  try {
    const res = await sample(scriptPrompt(a, ev), opts);
    if (state.view !== "generating" || ctl.signal.aborted) return;
    state.abort = null;
    const fixed = ensureEnding(cleanScript(res.text), a, res.truncated);
    if (scriptWordCount(fixed.script) < target * 0.3) throw { code: "empty_completion" };
    finishSession(ensureInteractive(fixed.script, a), "claude", fixed.added ? "Das Ende habe ich mit dem eingebauten Abschluss ergänzt." : "");
  } catch (e) {
    if (state.view !== "generating" || ctl.signal.aborted) return;
    state.abort = null;
    const code = e && e.code;
    if (PERMANENT.has(code)) capState.sample = false;
    const partial = e && e.text ? cleanScript(e.text) : "";
    if (code !== "refused" && partial && scriptWordCount(partial) >= target * 0.45) {
      finishSession(ensureInteractive(ensureEnding(partial, a, true).script, a), "claude", "Die Verbindung brach kurz vor Schluss ab. Ich habe das Ende mit dem eingebauten Abschluss ergänzt.");
      return;
    }
    showGenError(code);
  }
}

function updateStream(text) {
  const g = state.gen;
  if (!g || state.view !== "generating") return;
  g.pending = text;
  const now = performance.now();
  if (now - g.last < 300) {
    if (!g.t) g.t = setTimeout(() => { g.t = null; updateStream(g.pending); }, 320);
    return;
  }
  g.last = now;
  const words = scriptWordCount(text);
  g.fill.style.width = Math.min(100, Math.round((words / g.target) * 100)) + "%";
  g.label.textContent = `${words} von etwa ${g.target} Wörtern geschrieben`;
  const atBottom = g.stream.scrollTop + g.stream.clientHeight >= g.stream.scrollHeight - 40;
  g.stream.replaceChildren(scriptToNodes(cleanScript(text)));
  g.stream.hidden = false;
  if (atBottom) g.stream.scrollTop = g.stream.scrollHeight;
}

function showGenError(code) {
  const g = state.gen;
  if (!g) return;
  g.label.textContent = "";
  g.box.replaceChildren(
    h("p", { class: "warn", role: "alert" }, sampleErrorText(code)),
    h("div", { class: "actions" },
      capState.sample !== false ? h("button", { class: "btn primary", type: "button", onclick: () => doGenerate(true) }, "Nochmal versuchen") : null,
      h("button", { class: "btn", type: "button", onclick: () => finishOffline(state.answers, state.evaluation, buildOfflineScript(state.answers, state.evaluation)) }, "Eingebaute Bausteine nutzen"))
  );
}

async function finishSession(script, source, note) {

  let title = ev.title;

  const s = {
    id: newId(), kind: "session", lang: a.lang === "en" ? "en" : "de", createdAt: Date.now(), title, minutes: r.minutes, topic: r.topic,
    ending: r.ending, place: r.place, source, answers: clone(a), evaluation: evSave, script

async function startPreset(key) {

/* ---------- Serien ---------- */
function seriesInfo(s) {
  const a = (s && s.answers) || {};
  const total = Number(a.series) || 1;
  if (total < 2 || !a.seriesId) return null;
  const part = Math.min(total, Math.max(1, Number(a.seriesPart) || 1));
  const parts = (state.sessions || []).filter(x => x && x.answers && x.answers.seriesId === a.seriesId).map(x => Number(x.answers.seriesPart) || 1);
  const maxPart = Math.max(part, ...parts);
  return { part, total, focus: SERIES_FOCUS[SERIES_PLAN[total][part - 1]], next: part === maxPart && part < total ? part + 1 : 0 };
}
function startNextPart(s) {
  const info = seriesInfo(s);
  if (!info || !info.next) return;
  const a = Object.assign(clone(DEFAULT_ANSWERS), clone(s.answers || {}));
  /* Gleicher Ort und gleicher Weg nach unten wie im ersten Teil: das vertieft die Konditionierung */
  const r0 = resolveAnswers(s.answers || {}).r;
  if (a.place === "zufall") a.place = r0.place;
  if (a.deepener === "zufall") a.deepener = r0.deepener;
  a.seriesPart = info.next;
  a.preset = "";
  state.answers = a;
  state.evaluation = null;
  doEvaluate();
}

function selectSingle(f, v, group) {
  const a = state.answers;
  a[f.key] = f.key === "minutes" ? Number(v) : v;
  state.touched[f.key] = true;
  if (f.key === "topic" && !state.touched.ending) a.ending = v === "schlaf" ? "schlaf" : "wach";
  group.querySelectorAll(".choice").forEach(b => {
    const on = b.dataset.v === String(v);
    b.setAttribute("aria-checked", on ? "true" : "false");
    b.tabIndex = on ? 0 : -1;
  });
  clearErr(group.closest(".field"));
  saveDraft();
  const step = STEPS[state.step];
  if (step.fields.some(x => x.showIf || typeof x.label === "function" || typeof x.placeholder === "function")) {
    refreshFields(f.key, v);
  }
  if (step.auto) setTimeout(() => { if (state.view === "quiz" && STEPS[state.step] === step) next(); }, 280);
}

function refreshFields(key, v) {
  const form = $("#view form.fields");
  if (!form) return;
  const step = STEPS[state.step];
  form.replaceChildren(...step.fields.filter(f => !f.showIf || f.showIf(state.answers)).map(renderField));
  const btn = v == null ? form.querySelector(`#f-${key}`) : form.querySelector(`#f-${key} [data-v="${CSS.escape(String(v))}"]`);
  if (btn) btn.focus({ preventScroll: true });
}

function next() {
  const step = STEPS[state.step];
  for (const f of step.fields) {
    if (f.showIf && !f.showIf(state.answers)) continue;
    if (!f.required) continue;
    const v = state.answers[f.key];
    const empty = Array.isArray(v) ? v.length === 0 : (f.type === "textarea" ? String(v || "").trim().length < 3 : !String(v || "").trim());
    if (empty) {
      const box = $("#f-" + f.key + "-wrap");
      showErr(box, f.required);
      const el = box && box.querySelector("textarea, input, .choice, .chip");
      if (el) el.focus();
      return;
    }
  }
  const nx = nextVisible(state.step);
  if (nx >= 0) { state.step = nx; saveDraft(); go("quiz"); }
  else { saveDraft(); doEvaluate(); }
}

function back() {
  const pv = prevVisible(state.step);
  if (pv < 0) { go("start"); return; }
  state.step = pv;
  saveDraft();
  go("quiz");
}

  const input = h("input", { type: "range", id, min, max, step, value: String(settings[key]) });
  input.addEventListener("input", () => {
    const v = Number(input.value);
    settings[key] = v; SETTINGS[key] = v; saveSettings();
    out.textContent = show(v);
    if (onChange) onChange(v);
  });
  return h("div", { class: "setting" }, h("label", { for: id }, label, out), input);
}

function selectSetting(label, key, options, settings, onChange, hint) {
  const id = "set-" + key;
  const sel = h("select", { id }, options.map(([v, l]) => h("option", { value: String(v) }, l)));
  sel.value = String(settings[key]);
  if (sel.value !== String(settings[key]) && options[0]) { sel.value = String(options[0][0]); }
  sel.addEventListener("change", () => {
    const v = typeof settings[key] === "number" ? Number(sel.value) : sel.value;
    settings[key] = v; SETTINGS[key] = v; saveSettings();
    if (onChange) onChange(v);
  });
  return h("div", { class: "setting" }, h("label", { for: id }, label), sel, hint ? h("p", { class: "fhint" }, hint) : null);
}

/* ---------- Nur-Bild-Modus ---------- */
const Immersive = {
  on: false, el: null, lastTap: 0, holdT: null, hintT: null,
  init() {
    this.el = $("#immLayer");
    this.el.addEventListener("pointerdown", (e) => { e.preventDefault(); this.holdT = setTimeout(() => { this.holdT = null; this.exit(); emergencyFromUI(); }, 2000); });
    const up = () => { if (this.holdT) { clearTimeout(this.holdT); this.holdT = null; this.tap(); } };
    this.el.addEventListener("pointerup", up);
    this.el.addEventListener("pointercancel", () => { if (this.holdT) { clearTimeout(this.holdT); this.holdT = null; } });
    this.el.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && this.on && this.fs) { this.fs = false; } });
  },
  tap() {
    const now = performance.now();
    if (now - this.lastTap < 450) { this.lastTap = 0; this.exit(); return; }
    this.lastTap = now;
    this.hint();
  },
  hint(ms = 2600) { this.el.classList.add("hint"); clearTimeout(this.hintT); this.hintT = setTimeout(() => this.el.classList.remove("hint"), ms); },
  enter() {
    if (this.on || state.view !== "player") return;
    this.on = true;
    document.body.classList.add("immersive");
    this.el.hidden = false;
    this.hint(4200);
    try { const d = document.documentElement; if (d.requestFullscreen && !document.fullscreenElement) { const pr = d.requestFullscreen({ navigationUI: "hide" }); this.fs = true; if (pr && pr.catch) pr.catch(() => { this.fs = false; }); } } catch (e) { this.fs = false; }
    requestAnimationFrame(() => Orb.size());
  },
  exit() {
    if (!this.on) return;
    this.on = false;
    document.body.classList.remove("immersive");
    this.el.hidden = true;
    this.el.classList.remove("hint");
    try { if (this.fs && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch (e) {}
    this.fs = false;
    requestAnimationFrame(() => Orb.size());
  }
};

function dimOn() {
  const d = $("#dim");
  const p = d.querySelector("p");
  d.hidden = false;
  const hint = () => { p.style.opacity = "1"; clearTimeout(d._hintT); d._hintT = setTimeout(() => { p.style.opacity = "0"; }, 2600); };
  hint();
  let lastTap = 0;
  d.onclick = () => {
    const now = performance.now();
    if (now - lastTap < 450) { d.hidden = true; lastTap = 0; return; }
    lastTap = now;
    hint();
  };
}

/* ---------- Antwortfläche und Halten zum Aufwachen ---------- */
const TapUI = {
  el: null, q: null, dots: [], n: 3, holdT: null, downAt: 0,
  init() {
    this.el = $("#tapLayer");
    this.q = this.el.querySelector(".tl-q");
    this.dots = [...this.el.querySelectorAll(".tl-dots i")];
    this.el.addEventListener("pointerdown", (e) => { e.preventDefault(); this.downAt = performance.now(); this.holdT = setTimeout(() => { this.holdT = null; this.downAt = 0; emergencyFromUI(); }, 2000); });
    this.el.addEventListener("pointerup", () => { const d = performance.now() - this.downAt; this.cancelHold(); if (this.downAt && d < 800) this.tap(); this.downAt = 0; });
    this.el.addEventListener("pointercancel", () => { this.cancelHold(); this.downAt = 0; });
    this.el.addEventListener("contextmenu", (e) => e.preventDefault());
  },
  show(kind, n) {
    this.q.textContent = ckShort(kind) || "Tippen zum Antworten";
    this.n = n || 3;
    const box = this.el.querySelector(".tl-dots");
    if (this.dots.length !== this.n) { box.replaceChildren(...Array.from({ length: this.n }, () => h("i"))); this.dots = [...box.children]; }
    this.setCount(0);
    this.el.hidden = false;
    try { this.el.focus({ preventScroll: true }); } catch (e) {}
  },
  hide() { this.cancelHold(); this.voice(false); if (this.el) this.el.hidden = true; },
  voice(on) {
    if (!this.el) return;
    let v = this.el.querySelector(".tl-voice");
    if (!v) { v = h("p", { class: "tl-voice", "data-notr": "" }); this.el.querySelector(".tl-inner").append(v); }
    /* Die Beispiele folgen der Sprache der Session, weil die Spracherkennung diese Sprache hört */
    v.textContent = SLANG === "en" ? "Or say it out loud: “yes”, “no”, “one”, “two” or “three”" : "Oder sag es laut: „ja“, „nein“, „eins“, „zwei“ oder „drei“";
    v.hidden = !on;
  },
  setCount(n) { this.dots.forEach((d, i) => d.classList.toggle("on", i < n)); },
  tap() {
    const P = state.player;
    if (P && P.tap()) {
      this.setCount(Math.min(this.n, P.taps));
      this.el.classList.remove("pulse");
      void this.el.offsetWidth;
      this.el.classList.add("pulse");
    }
  },
  cancelHold() { if (this.holdT) { clearTimeout(this.holdT); this.holdT = null; } }
};

function emergencyFromUI() {
  const P = state.player;
  if (!P || state.view !== "player" || !(P.state === "playing" || P.state === "paused")) return;
  if (P.forceWake) return;
  TapUI.hide();
  $("#dim").hidden = true;
  toast("Ich hole dich jetzt sanft zurück.");
  P.emergency(false);
}

const TaskUI = {
  el: null, done: null, timers: [],
  init() {
    this.el = $("#taskLayer");

    this.text = this.el.querySelector(".tk-text");
    this.body = this.el.querySelector(".tk-body");
    this.el.querySelector(".tk-skip").addEventListener("click", () => this.finish({ skipped: true }));
    this.el.querySelector(".tk-end").addEventListener("click", () => { this.hide(); emergencyFromUI(); });
  },
  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); },
  clearTimers() { this.timers.forEach(clearTimeout); this.timers = []; },
  finish(res) { const f = this.done; this.done = null; if (f) f(res || {}); },
  show(kind, data, done) {
    this.clearTimers();
    this.stopMic();
    this.done = done;
    TapUI.hide();
    $("#dim").hidden = true;
    const [t, x] = TASK_UI[kind] || ["Kleine Aufgabe", ""];
    this.title.textContent = t;
    this.text.textContent = x;
    this.text.hidden = !x;
    this.body.replaceChildren(...this.build(kind, data || {}));
    this.el.dataset.kind = kind;
    this.el.hidden = false;
    /* Fokus auf den Dialog, nicht auf eine Antwort: kein Hinweis auf eine Option */
    const input = this.body.querySelector("input, textarea");
    try { (input || this.el).focus({ preventScroll: true }); } catch (e) {}
  },
  hide() { this.clearTimers(); this.stopMic(); this.done = null; if (this.el) this.el.hidden = true; },
  stopMic() { this.micReady = null; clearInterval(this.micTimer); this.micTimer = null; Mic.stopRecognition(); },
  build(kind, data) {
    const fin = (res) => this.finish(res);
    const meterEl = () => h("div", { class: "tk-meter", role: "img", "aria-label": "Mikrofon-Pegel" }, h("i"));
    if (kind === "sprechen") {
      /* Ohne Mikrofon: stattdessen schreiben */
      if (!Mic.stream) return this.build("schreiben", data);
      const target = String(data.sentence || "");
      const prog = data.progress || { count: 0 };
      const counter = h("p", { class: "tk-status", "aria-live": "polite" }, "Noch nichts gesagt");
      const meter = meterEl();
      const heard = h("p", { class: "fhint tk-heard", "data-notr": "" }, "");
      const bump = () => { prog.count++; Ambient.tick(); counter.textContent = `${prog.count}× laut gesagt`; };
      this.micReady = () => {
        const useReco = Mic.startRecognition(SLANG, (alts, final) => {
          heard.textContent = alts[0] || "";
          if (final && alts.some(a => sentenceMatch(target, a) >= 0.5)) bump();
        }, { continuous: true, interim: true });
        /* Ohne Spracherkennung: jede längere Sprechphase zählt als einmal gesagt */
        let voiced = 0, silent = 0, inUtt = false, floor = 0.02;
        const minDur = Math.max(800, target.split(/\s+/).length * 140);
        this.micTimer = setInterval(() => {
          const lv = Mic.level();
          meter.firstChild.style.width = Math.round(lv * 100) + "%";
          if (useReco && !Mic.recoBroken) return;
          if (!inUtt) floor = floor * 0.95 + lv * 0.05;
          const thr = Math.max(0.06, floor * 2.5);
          if (lv > thr) { voiced += 100; silent = 0; if (voiced > 250) inUtt = true; }
          else if (inUtt) { silent += 100; if (silent > 700) { if (voiced >= minDur) bump(); inUtt = false; voiced = 0; silent = 0; } }
          else voiced = 0;
        }, 100);
      };
      return [h("p", { class: "tk-sentence" }, target), meter, h("p", { class: "fhint" }, "Sprich den Satz laut, so oft du magst. Ich zähle mit."), counter, heard];
    }
    if (kind === "sagen") {
      if (!Mic.stream || !Mic.recognitionAvailable()) return this.build("wort", data);
      let got = "";
      const word = h("p", { class: "tk-sentence tk-said", "data-notr": "" }, "…");
      const meter = meterEl();
      const status = h("p", { class: "tk-status", "aria-live": "polite" }, "Ich höre zu …");
      const ok = h("button", { class: "btn primary", type: "button", disabled: true, onclick: () => { if (got) fin({ value: got }); } }, "Weiter");
      const chips = (data.suggestions || []).slice(0, 6).map(w => h("button", { class: "chip", type: "button", onclick: () => fin({ value: w }) }, w));
      this.micReady = () => {
        Mic.startRecognition(SLANG, (alts, final) => {
          const w = cleanWord(String(alts[0] || "").trim().split(/\s+/).slice(0, 2).join(" "));
          if (!w) return;
          got = w; word.textContent = w; ok.disabled = false;
          if (final) { status.textContent = "Verstanden."; Mic.stopRecognition(); this.later(() => fin({ value: got }), 1400); }
        }, { continuous: false, interim: true });
        this.micTimer = setInterval(() => { meter.firstChild.style.width = Math.round(Mic.level() * 100) + "%"; }, 100);
        /* Wenn die Spracherkennung nicht klappt: Wort eintippen */
        this.later(() => { if (Mic.recoBroken && !got && this.el.dataset.kind === "sagen") { this.stopMic(); this.body.replaceChildren(...this.build("wort", data)); } }, 2500);
      };
      return [word, meter, status, ok, chips.length ? h("div", { class: "chips tk-sugg" }, chips) : null].filter(Boolean);
    }
    if (kind === "farbe") {
      return [h("div", { class: "tk-colors", role: "group", "aria-label": "Farben" }, (data.colors || COLORS).map(col =>
        h("button", { type: "button", class: "tk-color", onclick: () => fin({ value: col.v }) },
          h("span", { class: "sw", style: `--sw:${col.c}`, "aria-hidden": "true" }), h("span", { class: "nm" }, col.v))))];
    }
    if (kind === "wort") {
      const input = h("input", { type: "text", class: "tk-input", maxlength: 24, placeholder: "z. B. leicht", enterkeyhint: "done", autocomplete: "off", autocapitalize: "off", "aria-label": "Dein Wort" });
      const ok = h("button", { class: "btn primary", type: "button", disabled: true }, "Weiter");
      const send = () => { if (cleanWord(input.value)) fin({ value: input.value }); };
      input.addEventListener("input", () => { ok.disabled = !cleanWord(input.value); });
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); send(); } });
      ok.addEventListener("click", send);
      return [input, h("div", { class: "chips tk-sugg" }, (data.suggestions || []).map(w => h("button", { type: "button", class: "chip", onclick: () => fin({ value: w }) }, w))), ok];
    }
    if (kind === "schreiben") {
      const target = String(data.sentence || "");
      const norm = (x) => String(x).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();
      const close = (a, b) => {
        a = norm(a); b = norm(b);
        if (!a || !b) return false;
        if (a === b) return true;
        const m = a.length, n = b.length;
        if (Math.abs(m - n) > Math.max(3, n * 0.2)) return false;
        let prev = Array.from({ length: n + 1 }, (_, j) => j);
        for (let i = 1; i <= m; i++) {
          const cur = [i];
          for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
          prev = cur;
        }
        return prev[n] <= Math.max(2, Math.round(n * 0.15));
      };
      const prog = data.progress || { count: 0 };
      const counter = h("p", { class: "tk-status", "aria-live": "polite" }, "Noch nichts geschrieben");
      const lines = h("div", { class: "tk-lines", "aria-hidden": "true" });
      const input = h("textarea", { class: "tk-input tk-write", rows: 2, maxlength: 140, autocomplete: "off", autocapitalize: "sentences", spellcheck: "false", "aria-label": "Schreib deinen Satz ab", placeholder: "Hier schreiben …" });
      const hint = h("p", { class: "fhint tk-whint" }, "Mit Enter abschicken.");
      const send = () => {
        if (!close(input.value, target)) { if (input.value.trim()) { hint.textContent = "Schreib genau den Satz von oben ab."; input.classList.add("shake"); setTimeout(() => input.classList.remove("shake"), 400); } return; }
        prog.count++;
        Ambient.tick();
        input.value = "";
        hint.textContent = "Und noch einmal.";
        counter.textContent = `${prog.count}× geschrieben`;
        lines.prepend(h("p", {}, target));
        while (lines.children.length > 4) lines.lastChild.remove();
      };
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); send(); } });
      const ok = h("button", { class: "btn primary", type: "button", onclick: () => { send(); input.focus(); } }, "Abschicken");
      return [h("p", { class: "tk-sentence" }, target), input, hint, ok, counter, lines];
    }
    if (kind === "umsehen") {
      let n = 0;
      const rings = [1, 2, 3].map(i => h("button", { type: "button", class: "tk-ring", "aria-label": `Ding ${i} gefunden`, "aria-pressed": "false" }, String(i)));
      rings.forEach(b => b.addEventListener("click", () => {
        if (b.getAttribute("aria-pressed") === "true") return;
        b.setAttribute("aria-pressed", "true");
        Ambient.tick();
        if (++n >= 3) this.later(() => fin({}), 450);
      }));
      return [h("div", { class: "tk-rings" }, rings)];
    }
    if (kind === "punkte") {
      const arena = h("div", { class: "tk-arena" });
      const status = h("p", { class: "tk-status", "aria-live": "polite" }, "Gleich geht es los …");
      const times = [];
      const spawn = () => {
        const dot = h("button", { type: "button", class: "tk-dot", "aria-label": `Lichtpunkt ${times.length + 1} von 3` });
        dot.style.left = (14 + Math.random() * 72) + "%";
        dot.style.top = (16 + Math.random() * 68) + "%";
        const t0 = performance.now();
        let hit = false;
        const catchIt = (e) => {
          if (hit) return;
          hit = true;
          if (e) e.preventDefault();
          times.push(performance.now() - t0);
          Ambient.tick();
          dot.classList.add("hit");
          this.later(() => dot.remove(), 260);
          status.textContent = `${times.length} von 3`;
          if (times.length >= 3) this.later(() => fin({ times }), 500);
          else this.later(spawn, 600 + Math.random() * 1000);
        };
        dot.addEventListener("pointerdown", catchIt);
        dot.addEventListener("click", () => catchIt());
        arena.append(dot);
      };
      this.later(() => { status.textContent = "0 von 3"; spawn(); }, 1400);
      return [arena, status];
    }
    if (kind === "zahl") {
      return [h("p", { class: "tk-number", "aria-live": "polite" }, String(data.number || "")),
        h("button", { class: "btn primary", type: "button", onclick: () => fin({}) }, "Gemerkt")];
    }
    if (kind === "zahlfrage") {
      return [h("div", { class: "tk-numbers", role: "group", "aria-label": "Welche Zahl war es?" }, (data.options || []).map(n =>
          h("button", { type: "button", class: "tk-num", onclick: () => fin({ value: n }) }, String(n)))),
        h("button", { class: "btn", type: "button", onclick: () => fin({ value: "weiss" }) }, "Weiß nicht mehr")];
    }
    return [h("button", { class: "btn primary tk-done", type: "button", onclick: () => fin({}) }, "Fertig")];
  }
};

function attachHold(el) {
  let t = null, x = 0, y = 0;
  const stop = () => { if (t) { clearTimeout(t); t = null; } };
  el.addEventListener("pointerdown", (e) => {
    if (e.target.closest && e.target.closest("button, select, input, textarea, summary, a")) return;
    const P = state.player;
    if (state.view !== "player" || !P || !(P.state === "playing" || P.state === "paused")) return;
    x = e.clientX; y = e.clientY;
    stop();
    t = setTimeout(() => { t = null; emergencyFromUI(); }, 2000);
  });
  el.addEventListener("pointermove", (e) => { if (t && (Math.abs(e.clientX - x) > 14 || Math.abs(e.clientY - y) > 14)) stop(); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => el.addEventListener(ev, stop));
}

/* ---------- Rückblick nach der Session ---------- */
const REVIEW_DEPTH = [{ v: 1, l: "kaum" }, { v: 2, l: "leicht" }, { v: 3, l: "mittel" }, { v: 4, l: "tief" }, { v: 5, l: "sehr tief" }];
const REVIEW_CHANGES = [
  { v: "langsamer", l: "Langsamer sprechen" }, { v: "schneller", l: "Schneller sprechen" },
  { v: "pausenlang", l: "Längere Pausen" }, { v: "pausenkurz", l: "Kürzere Pausen" },
  { v: "tiefer", l: "Mehr Vertiefung" }, { v: "wenigerfragen", l: "Weniger Fragen" }, { v: "mehrfragen", l: "Mehr Fragen" }
];

function stressRow(label, onPick) {
  const row = h("div", { class: "chips stress", role: "radiogroup", "aria-label": label });
  for (let v = 0; v <= 10; v++) {
    const b = h("button", { type: "button", class: "chip", role: "radio", "aria-checked": "false" }, String(v));
    b.addEventListener("click", () => { row.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-checked", x === b ? "true" : "false")); onPick(v); });
    row.append(b);
  }
  return row;
}

function fillReview(box, s, log, played, pre) {
  let post = null;
  const stressOut = h("p", { class: "fhint", "aria-live": "polite" });
  const stressBlock = [
    h("p", { class: "flabel" }, "Und jetzt: Wie angespannt bist du?"),
    stressRow("Anspannung nach der Session", (v) => {
      post = v;
      if (pre == null) { stressOut.textContent = ""; return; }
      const d = pre - v;
      stressOut.textContent = d > 0 ? `Von ${pre} auf ${v}: deine Anspannung ist um ${d} ${d === 1 ? "Punkt" : "Punkte"} gesunken.` : d === 0 ? `Gleich geblieben bei ${v}. Auch das ist eine wichtige Rückmeldung.` : `Von ${pre} auf ${v} gestiegen. Danke für die ehrliche Antwort, ich passe die nächste Session darauf an.`;
    }),
    stressOut
  ];
  const answered = log.filter(l => l.kind !== "notausstieg");
  let depth = 0;
  const actual = Math.max(1, Math.round((Number(played) || 0) / 60));
  let guess = 0;
  const guessOut = h("p", { class: "fhint", "aria-live": "polite" });
  const guessRow = h("div", { class: "chips", role: "radiogroup", "aria-label": "Wie lange, glaubst du, hat die Session gedauert?" });
  [5, 10, 15, 20, 30, 45, 60].forEach(m => {
    const b = h("button", { type: "button", class: "chip", role: "radio", "aria-checked": "false" }, `${m} Min`);
    b.addEventListener("click", () => {
      guess = m;
      guessRow.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-checked", x === b ? "true" : "false"));
      const diff = m - actual;
      guessOut.textContent = `Tatsächlich waren es ${actual} Minuten. ` + (Math.abs(diff) < Math.max(3, actual * 0.2)
        ? "Ziemlich genau geschätzt."
        : diff < 0 ? "Die Zeit ist für dich schneller vergangen. Das nennt man Zeitverzerrung, ein typisches Zeichen für Trance."
          : "Die Zeit hat sich für dich gedehnt. Auch das ist Zeitverzerrung, ein typisches Zeichen für Trance.");
    });
    guessRow.append(b);
  });
  const timeBlock = (Number(played) || 0) >= 120 ? [h("p", { class: "flabel" }, "Wie lange, glaubst du, hat die Session gedauert?"), guessRow, guessOut] : [];
  const changes = new Set();
  const depthRow = h("div", { class: "chips", role: "radiogroup", "aria-label": "Wie tief warst du insgesamt?" });
  REVIEW_DEPTH.forEach(o => {
    const b = h("button", { type: "button", class: "chip", role: "radio", "aria-checked": "false" }, o.l);
    b.addEventListener("click", () => { depth = o.v; depthRow.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-checked", x === b ? "true" : "false")); });
    depthRow.append(b);
  });
  const changeRow = h("div", { class: "chips" }, REVIEW_CHANGES.map(o => {
    const b = h("button", { type: "button", class: "chip", "aria-pressed": "false" }, o.l);
    b.addEventListener("click", () => { if (changes.has(o.v)) changes.delete(o.v); else changes.add(o.v); b.setAttribute("aria-pressed", changes.has(o.v) ? "true" : "false"); });
    return b;
  }));
  const save = h("button", { class: "btn primary small", type: "button" }, "Rückmeldung speichern");
  save.addEventListener("click", async () => {
    if (changes.has("langsamer")) { SETTINGS.rate = clamp((SETTINGS.rate || 0.85) - 0.06, 0.6, 1.1); SETTINGS.rateTouched = true; }
    if (changes.has("schneller")) { SETTINGS.rate = clamp((SETTINGS.rate || 0.85) + 0.06, 0.6, 1.1); SETTINGS.rateTouched = true; }
    if (changes.has("pausenlang")) SETTINGS.pauseFactor = clamp((SETTINGS.pauseFactor || 1) + 0.15, 0.6, 1.8);
    if (changes.has("pausenkurz")) SETTINGS.pauseFactor = clamp((SETTINGS.pauseFactor || 1) - 0.15, 0.6, 1.8);
    if (changes.has("wenigerfragen")) SETTINGS.feedbackPref = "wenig";
    if (changes.has("mehrfragen")) SETTINGS.feedbackPref = "normal";
    SETTINGS.moreDepth = changes.has("tiefer") || (depth > 0 && depth <= 2);
    saveSettings();
    if (!s.demo) {
      s.feedback = { at: Date.now(), depth, changes: [...changes], guess: guess || null, actual: guess ? actual : null, pre: pre != null ? pre : null, post };
      if (s.runs && s.runs.length) s.runs[s.runs.length - 1].feedback = s.feedback;
      await Store.save(s);
      state.sessions = [s, ...state.sessions.filter(x => x.id !== s.id)];
    }
    save.disabled = true;
    save.textContent = "Gespeichert";
    toast(s.demo ? "Danke. Ich passe Stimme und Pausen an." : "Danke. Die nächste Session passe ich daran an.");
  });
  const ser = s.demo ? null : seriesInfo(s);
  box.replaceChildren(...[
    h("h3", { class: "sec" }, "Rückblick"),
    s.demo ? null : [h("p", { class: "flabel" }, "Wie hat dir die Session gefallen?"), starRow(s)],
    answered.length
      ? h("ul", { class: "sugg" }, answered.map(l => h("li", {}, `${l.kind === "aufgabe" ? "Aufgabe „" + (tkTitle(l.task) || "Aufgabe") + "“" : ckTitle(l.kind) || l.kind}: ${l.label}`)))
      : h("p", { class: "fhint" }, "In dieser Session gab es keine Rückfragen und keine Aufgaben."),
    log.some(l => l.kind === "notausstieg") ? h("p", { class: "fhint" }, "Du hast die Session vorzeitig beendet. Das ist völlig in Ordnung.") : null,
    stressBlock,
    timeBlock,
    h("p", { class: "flabel" }, "Wie tief warst du insgesamt?"), depthRow,
    h("p", { class: "flabel" }, "Was soll beim nächsten Mal anders sein?"), changeRow,
    h("div", { class: "actions" }, save),
    ser && ser.next ? h("div", { class: "nextpart" },
      h("p", { class: "flabel" }, `Weiter mit Teil ${ser.next}: ${SERIES_FOCUS[SERIES_PLAN[ser.total][ser.next - 1]].l}`),
      h("p", { class: "fhint" }, "Am besten morgen oder übermorgen. Dein Unterbewusstsein arbeitet in der Zwischenzeit weiter. Teil " + ser.next + " baut auf deinen Rückmeldungen auf, speichere sie also vorher."),
      h("button", { class: "btn primary", type: "button", onclick: () => startNextPart(s) }, `Teil ${ser.next} erstellen`)) : null,
    ser && !ser.next && ser.part === ser.total ? h("p", { class: "fhint" }, "Das war der letzte Teil deiner Serie. Du kannst jeden Teil jederzeit wieder anhören.") : null
  ].flat(Infinity).filter(x => x != null && x !== false));
}

/* ---------- Bibliothek ---------- */
function libItem(s) {
  const place = (PLACES.find(p => p.v === s.place) || {}).l || "";
  const ser = seriesInfo(s);
  return h("li", {},
    h("button", { class: "t", type: "button", onclick: () => openSession(s) }, s.title),
    sessionTags(s),
    h("span", { class: "m" }, [fmtDate(s.createdAt), `${s.minutes} Min`, place, s.ending === "schlaf" ? "zum Einschlafen" : "mit Aufwachen", s.feedback && s.feedback.depth ? `Tiefe ${s.feedback.depth} von 5` : ""].filter(Boolean).join(" · ")),
    starRow(s),
    h("span", { class: "b" },
      ser && ser.next ? h("button", { class: "btn small primary", type: "button", onclick: () => startNextPart(s) }, `Teil ${ser.next} erstellen`) : null,
      h("button", { class: "btn small", type: "button", onclick: () => openSession(s) }, "Anhören"),
      h("button", { class: "btn small", type: "button", "aria-label": `„${s.title}“ löschen`, onclick: () => deleteSession(s) }, "Löschen")));
}

async function deleteSession(s) {
  const ok = await confirmBox("Session löschen?", `„${s.title}“ wird gelöscht. Das lässt sich nicht rückgängig machen.`, "Löschen");
  if (!ok) return;
  await Store.remove(s.id);
  state.sessions = state.sessions.filter(x => x.id !== s.id);
  updateLibCount();
  toast("Session gelöscht.");
  render({ keepScroll: true, noFocus: true });
}

/* ---------- Sessions exportieren und importieren ---------- */
async function exportSessions() {
  const items = (await Store.list()).filter(s => s && !s.demo && s.script);
  if (!items.length) { toast("Noch keine Sessions zum Exportieren."); return; }
  const data = JSON.stringify({ app: "trance-deep", version: 1, exported: Date.now(), sessions: items });
  const name = `trance-deep-sessions-${new Date().toISOString().slice(0, 10)}.json`;
  const dl = await Caps.downloads;
  if (dl) {
    try { await dl.save({ filename: name, data }); toast(`${items.length} Sessions exportiert.`); }
    catch (e) { if (!(e && e.code === "declined")) toast("Exportieren hat nicht geklappt."); }
    return;
  }
  if (downloadBlob(new Blob([data], { type: "application/json" }), name)) toast(`${items.length} Sessions exportiert.`);
  else toast("Exportieren hat nicht geklappt.");
}
function importSessions() {
  const input = h("input", { type: "file", accept: "application/json,.json", hidden: true });
  input.addEventListener("change", async () => {
    const f = input.files && input.files[0];
    input.remove();
    if (!f) return;
    let list = [];
    try { const x = JSON.parse(await f.text()); list = Array.isArray(x) ? x : Array.isArray(x.sessions) ? x.sessions : []; } catch (e) { list = []; }
    list = list.filter(s => s && typeof s === "object" && typeof s.script === "string" && s.script.length > 50 && s.title);
    if (!list.length) { toast("In dieser Datei habe ich keine Sessions gefunden."); return; }
    const have = new Set((await Store.list()).map(s => s.id));
    let n = 0;
    for (const s0 of list) {
      if (have.has(s0.id)) continue;
      const s = Object.assign({}, s0, { id: s0.id || newId(), kind: "session" });
      try { await Store.save(s); n++; } catch (e) {}
    }
    state.sessions = await Store.list();
    updateLibCount();
    toast(n ? `${n} Sessions importiert.` : "Diese Sessions sind schon da.");
    if (state.view === "library") go("library");
  });
  document.body.append(input);
  input.click();
}

function libMatch(s, f) {
  const a = s.answers || {};
  if (f === "fav") return (s.stars || 0) >= 4;
  if (f === "serie") return !!seriesInfo(s);
  if (f === "schnell") return !!a.preset;
  if (f === "dauerhaft") return !a.deleteAll;
  if (f === "frei") return !!a.deleteAll;
  if (f.startsWith("t:")) return s.topic === f.slice(2);
  return true;
}
VIEWS.library = function () {
  const list = h("ul", { class: "lib" });
  const hint = h("p", { class: "hint" }, "Wird geladen …");
  const filters = h("div", { class: "chips filters", role: "radiogroup", "aria-label": "Sessions filtern", hidden: true });
  let filter = state.libFilter || "alle";
  const apply = () => {
    const shown = state.sessions.filter(s => libMatch(s, filter));
    list.replaceChildren(...(shown.length ? shown.map(libItem) : [h("li", { class: "empty" }, filter === "fav" ? "Noch keine Favoriten. Gib einer Session 4 oder 5 Sterne." : "Keine Session passt zu diesem Filter.")]));
  };
  Store.list().then(items => {
    state.sessions = items;
    updateLibCount();
    if (state.view !== "library") return;
    if (!items.length) { hint.textContent = "Noch keine Sessions. Deine erste ist in ein paar Minuten fertig."; return; }
    hint.textContent = Store.note();
    const topics = [...new Set(items.map(s => s.topic).filter(t => TOPICS.some(x => x.v === t)))];
    const opts = [["alle", "Alle"], ["fav", "★ Favoriten"],
      ...(items.some(s => seriesInfo(s)) ? [["serie", "Serien"]] : []),
      ...(items.some(s => s.answers && s.answers.preset) ? [["schnell", "Schnellstart"]] : []),
      ...(items.some(s => s.answers && s.answers.deleteAll) ? [["dauerhaft", "Mit dauerhaften"], ["frei", "Ohne dauerhafte"]] : []),
      ...(topics.length > 1 ? topics.map(t => ["t:" + t, labelOf(TOPICS, t)]) : [])];
    if (!opts.some(o => o[0] === filter)) filter = "alle";
    filters.replaceChildren(...opts.map(([v, l]) => {
      const b = h("button", { type: "button", class: "chip", role: "radio", "aria-checked": v === filter ? "true" : "false" }, l);
      b.addEventListener("click", () => {
        filter = v; state.libFilter = v;
        filters.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-checked", x === b ? "true" : "false"));
        apply();
      });
      return b;
    }));
    filters.hidden = items.length < 2;
    apply();
  });
  return h("div", {},
    h("p", { class: "eyebrow" }, "Meine Sessions"),
    h("h2", { class: "q", "data-focus": "" }, "Deine gespeicherten Sessions"),
    hint, filters, list,
    h("div", { class: "actions", style: "margin-top:1.5rem" },
      h("button", { class: "btn primary", type: "button", onclick: () => startQuiz(false) }, "Neue Session beginnen"),
      h("button", { class: "btn", type: "button", onclick: startDemo }, "Fünf Minuten reinhören")),
    h("div", { class: "transfer" },
      h("p", { class: "flabel" }, "Sessions übertragen"),
      h("p", { class: "fhint" }, NO_CLAUDE ? "Sessions aus der Online-Version holst du hier herein. Dort tippst du unter „Meine Sessions“ auf „Exportieren“." : "Für die HTML-Datei mit Mikrofon: Exportieren, dann in der Datei unter „Meine Sessions“ importieren."),
      h("div", { class: "actions" },
        h("button", { class: "btn small", type: "button", onclick: exportSessions }, "Exportieren"),
        h("button", { class: "btn small", type: "button", onclick: importSessions }, "Importieren"))));
};

  attachHold($("#view"));
  attachHold($("#dim"));
  document.addEventListener("keydown", (e) => {
    if (state.view !== "player" || !state.player || !state.player.listening) return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); TapUI.tap(); }
  });
  $("#homeBtn").addEventListener("click", () => go("start"));
  $("#libBtn").addEventListener("click", () => go("library"));
  window.addEventListener("resize", () => { Orb.size(); drawCharts(); if (state.playerUpdate && state.view === "player") state.playerUpdate(); });
  /* Kommt die Seite nach dem Ausschalten des Bildschirms zurück: weiter, wo die Stimme stehen geblieben ist */
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", () => {
    const P = state.player;
    if (document.visibilityState === "hidden") { hiddenAt = performance.now(); return; }
    if (!P || P.state !== "playing") return;
    Wake.on();
    if (hiddenAt && performance.now() - hiddenAt > 3000 && P.mode === "voice" && !P.listening && !P.taskOpen) {
      try { P.pause(); P.play(); toast("Weiter geht’s."); } catch (e) {}
    }
    hiddenAt = 0;
  });
  if (data && data.view === "quiz" && data.answers) {
    state.answers = Object.assign(clone(DEFAULT_ANSWERS), data.answers);
    state.step = clamp(data.step | 0, 0, STEPS.length - 1);
    state.touched = data.touched || {};
    state.view = "quiz";
  }
  render();
}

try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function") {
    hot.snapshot(() => ({ view: state.view === "quiz" ? "quiz" : "start", step: state.step, answers: state.answers, touched: state.touched }));
  }
  if (hot && typeof hot.ready === "function") hot.ready(boot);
  else boot((hot && hot.data) || {});
} catch (e) {
  boot({});
}

</script>
</body>
</html>
