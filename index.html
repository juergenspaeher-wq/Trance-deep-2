    r.wakeCycles ? `Dazwischen weckt dich die Stimme ${["", "einmal", "zweimal", "dreimal"][r.wakeCycles]} kurz auf, und mit dem Wort Tiefgang gehst du wieder tiefer.` : [],
    r.surpriseDrop && r.wakeCycles ? `Das Wort darf auch einmal ohne Ankündigung kommen. Dann sinkst du einfach noch tiefer.` : [],

    r.deleteAll ? `Alle Auslöser gelten nur hier und lösen sich am Ende auf.` : `Alle Auslöser wirken nur so, wie du es dir gewünscht hast.`,

}

/* ---------- Serien: Bausteine je nach Schwerpunkt des Teils ---------- */
function bSerieStart(c) {
  const r = c.r;
  if (r.series < 2) return [];
  const k = r.seriesPart, n = r.series, nw = { 3: "drei", 5: "fünf" }[n];
  const quick = r.minutes <= 10;
  if (k === 1) return [
    `Das ist der erste von ${nw} Teilen.`,

  ];
  return [
    k === n ? `Das ist der letzte Teil deiner Serie.` : `Das ist Teil ${k} von ${n}.`,
    V(`Dein Körper erinnert sich schon an den Weg nach innen.`, `Du kennst den Weg nach innen schon. Dein Körper erinnert sich daran.`),
    quick ? [] : `Heute geht es leichter als beim letzten Mal. Und ein Stück tiefer.`, `~2`

function bSerieLernen(c) {
  if (c.r.seriesFocus !== "lernen") return [];

    `Spür kurz, wie sich deine Trance gerade anfühlt. Schwere Lider, ein ruhiger Atem. Das sind ihre Zeichen. Beim nächsten Mal erkennt dein Körper sie wieder.`, `~3`

    `Nimm dir einen Moment und beobachte, wie sich deine Trance gerade anfühlt.`, `~2`,

    `Beim nächsten Mal erkennt dein Körper sie wieder, und du findest schneller hierher zurück.`, `~3`

}
function bSerieTiefer(c) {
  if (c.r.seriesFocus !== "vertiefen") return [];
  return [
    `Und weil du den Weg jetzt schon kennst, gehst du heute noch ein Stück weiter.`, `~2`,
    c.avoid.has("zaehlen")
      ? [`Mit jedem Ausatmen sinkst du doppelt so tief.`, `~6`]
      : c.r.minutes <= 10
        ? [`Ich zähle von drei bis eins. Mit jeder Zahl doppelt so tief.`, `Drei.`, `~2`, `Zwei.`, `~2`, `Eins.`, `~3`]
        : [`Ich zähle von fünf bis eins. Mit jeder Zahl sinkst du doppelt so tief.`, `Fünf.`, `~2`, `Vier.`, `~2`, `Drei.`, `~2`, `Zwei.`, `~2`, `Eins.`, `~3`],
    `Tiefer als beim letzten Mal. Ganz von allein.`, `~4`

}
function bSerieKern(c) {
  return c.r.seriesFocus === "kern" ? [`Heute gehört die ganze Tiefe deinem Thema.`, `~2`] : [];
}
function bSerieWiederholung(c) {
  const f = c.r.seriesFocus;
  if (f !== "verstaerken" && f !== "verankern") return [];
  const quick = c.r.minutes <= 10;
  return [
    quick ? `Ich wiederhole die wichtigsten Sätze. Mit jedem Mal werden sie fester.` : `Ich wiederhole jetzt die wichtigsten Sätze. Mit jeder Wiederholung sinken sie tiefer in dich ein, und mit jedem Teil dieser Serie werden sie fester.`, `~2`,
    c.suggestions.slice(0, quick ? (f === "verstaerken" ? 2 : 1) : (f === "verstaerken" ? 4 : 2)).map(x => [x, `~3`]),

/* Selbsthypnose-Schlüssel: eine einfache, sichere Anleitung für zu Hause */

    `Dort sagst du dir deinen Satz: ${c.focus}`, `~2`,

    `Du bleibst dabei immer bei dir und kannst jederzeit aufhören, einfach indem du die Augen öffnest.`, `~3`,
    `Geh es jetzt einmal in Gedanken durch. Sieh dich an deinem ruhigen Ort und hör deinen Satz: Ich gehe jetzt nach innen.`, `~6`,

function bSerieAusblick(c) {
  const r = c.r;
  if (r.series < 2) return [];
  if (r.seriesPart < r.series) return [
    V(`Im nächsten Teil machen wir genau hier weiter.`, `Beim nächsten Teil knüpfen wir genau hier an.`),

  return [
    `Das war der letzte Teil deiner Serie.`,
    r.deleteAll ? `Wie vereinbart bleibt kein Auslöser zurück. Nur die Erholung und alles, was du über dich erfahren hast.` : `Alles, was du in diesen ${r.series === 3 ? "drei" : "fünf"} Teilen gelernt hast, gehört jetzt dir.`, `~2`

/* ASMR-Stimmung: leise Geräusche und ein angenehmes Kribbeln */
function bAsmrKribbeln(c) {
  if (!c.r.asmr) return [];
  if (c.r.minutes <= 10) return [`Hör genau hin. Ganz leise Geräusche. Vielleicht spürst du dabei ein feines, angenehmes Kribbeln an Kopf und Nacken. Genieß es, wenn es kommt.`, `~3`];
  return [
    `Hör einmal genau hin. Ganz leise Geräusche. Ein sanftes Rascheln. Ein feines Knistern.`, `~3`,
    `Vielleicht spürst du dabei ein feines, angenehmes Kribbeln. Am Kopf, im Nacken, vielleicht den Rücken hinunter.`, `~3`,
    `Wenn es kommt, genieß es. Wenn nicht, ist das genauso gut. Jedes leise Geräusch macht dich noch ruhiger.`, `~4`

/* Unangekündigtes Vertiefen mit dem Auslösewort (nur wenn gewünscht und schon eingeführt) */
function bDrop(c) {
  if (!c.r.surpriseDrop || !c.r.wakeCycles) return [];
  return [`SNAP`, `Tiefgang.`, `~1`, `Doppelt so tief. Ganz von allein.`, `~4`];
}

/* ---------- Wachphase: kurz aufwachen, Aufgabe, dann tiefer zurück ---------- */
function bWach(c, k) {
  const r = c.r;
  const task = (r.taskPlan || [])[k - 1] || "strecken";
  const quick = r.minutes <= 10;
  const noCount = c.avoid.has("zaehlen");
  const style = r.ending !== "schlaf" && r.wake === "schnips" ? "schnips" : (noCount || r.wake === "einfach") ? "einfach" : "zaehlen";
  return [
    `#${r.wakeCycles > 1 ? "Wachphase " + k : "Wachphase"}|1`,
    k === 1 ? [
      `Gleich hole ich dich für einen kurzen Moment zurück.`,
      quick ? `Und danach gehst du noch tiefer als jetzt.` : `Nur für einen Augenblick. Und danach gehst du noch tiefer in die Trance als jetzt.`,
      quick ? [] : `Jedes Mal, wenn du kurz auftauchst, sinkst du danach nur noch tiefer.`, `~2`
    ] : [
      `Gleich tauchst du noch einmal kurz auf.`,
      `Und du weißt schon: Danach geht es noch tiefer.`, `~2`
    ],
    style === "zaehlen" ? (quick ? [
      `Ich zähle bis drei. Bei drei bist du kurz ganz wach.`, `~1`,
      `Eins. Zwei.`, `~1`,
      `Drei. Augen auf. Ganz wach.`, `~2`
    ] : [
      `Ich zähle bis drei. Bei drei öffnest du die Augen und bist ganz wach.`, `~1`,
      `Eins. Energie fließt in deinen Körper.`, `~2`,

    ]) : style === "schnips" ? [

  ];
}

function bZurueck(c, k) {
  const r = c.r;
  const task = (r.taskPlan || [])[k - 1] || "strecken";
  const v = r.visual;
  const quick = r.minutes <= 10;
  const deepen = {
    1: [V(`Mit jedem Ausatmen sinkst du weiter. Tiefer und tiefer.`, `Jeder Atemzug trägt dich weiter nach unten.`, `Du sinkst und sinkst, ganz von allein.`), `~4`, quick ? [] : [`Deine Arme werden schwer. Deine Beine werden schwer.`, `~3`], `Und dein Kopf wird ganz still.`, `~4`],
    2: [`Noch tiefer als beim letzten Mal.`, `~3`, `Jedes Auftauchen hat dich nur noch tiefer gebracht.`, `~4`, `Ganz tief. Ganz ruhig.`, `~4`],
    3: [`So tief warst du heute noch nicht.`, `~4`, `Und mit jedem Atemzug noch ein kleines Stück tiefer.`, `~4`, `Ganz unten. Ganz bei dir.`, `~5`]
  }[k] || [];
  return [
    `#Tiefer als zuvor|${wakeDepth(k)}`,
    V(`Und jetzt geht es wieder nach unten.`, `Und jetzt sinkst du wieder.`, `Zeit, wieder in die Tiefe zu gehen.`),
    v === "keine" ? `Lass deinen Blick auf einem Punkt vor dir ruhen.` : `Schau noch einmal auf ${VISUAL_REF[v]}.`,
    `Lass deinen Blick ganz weich werden. Und spür, wie deine Lider schon wieder schwer werden.`, `~3`,
    k === 1 ? [
      `Gleich hörst du ein Fingerschnipsen und das Wort Tiefgang.`,
      `In diesem Moment schließen sich deine Augen, und du sinkst zurück in die Trance. Doppelt so tief wie vorher.`,
      `Das Wort wirkt nur hier, in deinen Sessions, und nur, wenn du es willst.`,
      r.surpriseDrop ? `Und vielleicht kommt es später noch einmal ganz unerwartet. Dann sinkst du einfach noch tiefer.` : [], `~2`
    ] : [`Du weißt, was jetzt kommt.`, `~1`],
    `Atme tief ein.`, `~2`,
    `SNAP`,
    `Tiefgang.`, `~1`,
    `Augen zu. Lass alles los.`, `~3`,
    V(`Doppelt so tief wie vorher. Ganz weich und ganz schwer.`, `Doppelt so tief wie vorher. Alles lässt los.`, `Doppelt so tief wie vorher. Weich, schwer und ganz ruhig.`), `~4`,
    task === "farbe" ? [`Deine Farbe {FARBE} breitet sich in dir aus, warm und weich, und trägt dich nach unten.`, `~4`] : [],
    task === "wort" ? [`Dein Wort „{WORT}“ sinkt mit dir nach unten, ganz von allein.`, `~4`] : [],
    task === "schreiben" ? [`{?SATZ}Und dein Satz schreibt sich jetzt ganz von allein in dir weiter, Zeile für Zeile, immer tiefer.`, `~4`] : [],
    task === "sprechen" ? [`{?SATZ}Und dein Satz klingt jetzt ganz von allein in dir weiter, immer leiser, immer tiefer.`, `~4`] : [],
    task === "sagen" ? [`Dein Wort „{WORT}“ sinkt mit dir nach unten, ganz von allein.`, `~4`] : [],
    task === "zahl" ? [`{?ZAHL}Die Zahl von eben darf jetzt ganz weit nach hinten rutschen, du musst sie dir nicht merken.`, `~3`] : [],
    deepen,
    k === 1 && r.interactions.includes("lider") ? `CHECK:lider` : []
  ];
}

/* Das Auslösewort gilt nur in den Sessions */
function triggerEnd(c) {
  if (!c.r.wakeCycles) return [];
  return c.r.deleteAll
    ? `Das Wort Tiefgang hat ab jetzt keine besondere Wirkung mehr. Es ist wieder ein ganz normales Wort.`
    : `Das Wort Tiefgang wirkt nur in deinen Sessions, und nur, wenn du es willst. Im Alltag ist es ein ganz normales Wort.`;
}

function bOrt(c, min) {
  const long = min >= 2.5;
  const quick = c.r.minutes <= 10;
  const P = PLACE_TEXT[c.r.place] || PLACE_TEXT.wald;
  const order = { sehen: ["sehen", "hoeren", "fuehlen", "riechen"], hoeren: ["hoeren", "sehen", "fuehlen", "riechen"], fuehlen: ["fuehlen", "sehen", "hoeren", "riechen"], alles: ["sehen", "hoeren", "fuehlen", "riechen"] }[c.r.sense];
  const lines = [`#Wohlfühlort|7`, V(`In dieser tiefen Ruhe taucht jetzt dein Wohlfühlort auf.`, `Und aus dieser Ruhe heraus entsteht jetzt dein Wohlfühlort.`, `Langsam zeigt sich jetzt dein Wohlfühlort.`), `~2`];
  const used = new Set();
  if (c.r.place === "eigener") {
    lines.push(`Du gehst an deinen ganz eigenen Ort. Einen Ort, an dem du dich vollkommen sicher und wohl fühlst.`);
    if (c.PD) lines.push(`Du hast ihn so beschrieben: ${c.PD}.`);
    lines.push(`~3`);
  } else {
    lines.push(P.sehen[0], `~2`);
    used.add(P.sehen[0]);
  }
  /* Jedes Mal etwas andere Stimmung am Ort */
  const moods = [
    `Heute ist früher Morgen. Das Licht ist zart und frisch, alles erwacht gerade erst.`,
    `Heute ist später Nachmittag. Warmes, goldenes Licht liegt über allem.`,
    `Heute ist Abend. Der Himmel färbt sich rosa und orange, und alles wird still.`,
    `Heute liegt ein feiner, heller Dunst in der Luft. Alles wirkt weich und gedämpft.`,
    `Heute ist ein milder Sommertag. Die Wärme legt sich wie eine Decke um dich.`,
    `Heute ist ein klarer Herbsttag. Die Luft ist frisch, und die Farben leuchten.`,
    c.avoid.has("dunkelheit") ? null : `Heute ist Nacht. Über dir funkeln unzählige Sterne, und alles ist friedlich.`,
    c.avoid.has("wasser") ? null : `Heute fällt ein leiser, warmer Sommerregen. Du bist geschützt und hörst ihm einfach zu.`
  ].filter(Boolean);
  if (c.r.place !== "eigener" || chance(0.5)) lines.push(V(...moods), `~3`);
  order.forEach((sense, i) => {
    if (quick && sense === "riechen") return;
    const arr = (P[sense] || []).filter(l => !used.has(l)).map(l => [RND(), l]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    const take = (long || i === 0 || (c.r.sense === "alles" && !quick)) ? arr : arr.slice(0, 1);
    if (!take.length) return;
    take.forEach(l => lines.push(l));
    lines.push(i === 0 ? "~4" : "~3");
  });
  if (c.PD && c.r.place !== "eigener") lines.push(`Und hier ist auch alles, was für dich dazugehört: ${c.PD}.`, `~4`);
  if (long) lines.push(...P.extra);
  if (c.r.minutes >= 30 && chance(0.5)) {
    const item = V(`einen glatten, warmen Stein`, `eine weiche Feder`, `einen kleinen, goldenen Schlüssel`, `eine leuchtende Glasmurmel`, `ein kleines Blatt mit einer Botschaft für dich`, `einen Kristall, der das Licht einfängt`);
    lines.push(`Und heute liegt hier etwas für dich bereit. Du entdeckst es ganz leicht: ${item}.`, `~2`,
      `Es steht für ${FEELING_NOUN[c.F1] || "deine Ruhe"}. Nimm es in die Hand. Du darfst es mitnehmen.`, `~4`);
  }
  const ad = c.r.adapt || {};
  if (ad.favColor && !(c.r.taskPlan || []).includes("farbe")) lines.push(`Und irgendwo hier leuchtet deine Farbe aus den letzten Sessions: ${ad.favColor}. Sie gehört schon zu diesem Ort.`, `~3`);
  lines.push(`Hier bist du vollkommen sicher.`);
  if (c.tt.has("sicherheit")) lines.push(`Niemand kann dich hier stören. Dieser Ort gehört nur dir.`, `~3`);
  if (!quick) lines.push(`Das ist dein Ort. Du kannst jederzeit hierher zurückkehren, wann immer du willst.`, `~3`);
  lines.push(`Lass dieses Gefühl von Sicherheit und Ruhe in jede Zelle deines Körpers fließen.`, `~5`);
  if (c.r.minutes >= 45) lines.push(
    `Geh noch ein wenig umher an deinem Ort. Entdeck etwas, das du vorhin noch nicht bemerkt hast.`, `~6`,
    `Vielleicht eine Farbe. Ein Geräusch. Eine kleine Veränderung im Licht.`, `~6`,
    `Alles hier ist dir vertraut und gleichzeitig ein bisschen neu.`, `~5`
  );
  if (c.r.minutes >= 30) lines.push(
    `Und während du hier bist, kannst du noch ein Stück tiefer gehen.`,
    `Mit jedem Ausatmen sinkst du doppelt so tief. Ganz von allein.`, `~4`,
    `Tiefer. Und noch tiefer.`, `~5`,
    `So tief, wie es sich für dich gerade richtig anfühlt.`, `~6`
  );
  if (c.r.checkLevel === "normal") lines.push(`CHECK:ort`);
  return lines;
}

function bPhaenomene(c) {
  const lines = [
    `In dieser tiefen Trance kann dein Körper Dinge erleben, die im Alltag nicht möglich sind.`,
    `Du bleibst dabei die ganze Zeit sicher. Und alles, was wir hier ausprobieren, löst sich danach wieder vollständig auf.`, `~3`
  ];
  let asked = 0;
  c.r.phenomena.forEach(v => {
    if (c.r.surprise.includes(v)) lines.push(`Und jetzt kommt eine kleine Überraschung.`, `~2`);
    lines.push(PHENOMENON_BLOCKS[v](c));
    if (c.r.checkLevel === "normal" && asked < 3 && v !== "mantra") { lines.push(`CHECK:phaenomen`); asked++; }
    else lines.push(V(`Gut so.`, `Schön.`, `Genau so.`, `Wunderbar.`), `~3`);
  });
  lines.push(`Alle Erfahrungen aus diesem Teil sind jetzt wieder aufgelöst. Dein Körper ist frei und fühlt sich ganz normal an.`, `~4`);
  return lines;
}

        `Stell dir vor, du hältst eine Handvoll feinen, warmen Sand.`,
        `In diesem Sand steckt alles, was du loslassen willst. Vielleicht ${c.R}.`, `~4`,
        `Und jetzt öffne langsam deine Finger.`,
        `Spür, wie der Sand Korn für Korn durch deine Finger rieselt.`, `~6`,
        `Bis deine Hand ganz leer und leicht ist.`, `~5`
      ];
      return [
        intro,
        `Was war, gehört zu deiner Geschichte. Aber es bestimmt nicht deine Zukunft.`, `~4`,
        c.r.release.includes("Schuldgefühle") ? [`Du darfst dir selbst verzeihen.`, `~4`] : [],
        c.r.release.includes("Ärger") ? [`Du darfst Frieden schließen. Nicht für die anderen, sondern für dich.`, `~4`] : [],
        `Wo vorher Last war, ist jetzt Platz. Platz für ${c.FN}.`, `~5`,
        c.SIT ? [sitIntro, `Ab jetzt merkst du dort, wie viel leichter du geworden bist.`, `~4`] : [],
        long ? [`Mit jedem Ausatmen lässt du noch ein bisschen mehr los.`, `Mit jedem Einatmen holst du dir neue Leichtigkeit.`, `~8`] : []
      ];
    },
    kreativ: () => [
      `Stell dir vor, an deinem Wohlfühlort gibt es eine Tür. Dahinter liegt deine innere Werkstatt.`,
      `Öffne sie. Der Raum dahinter ist hell und weit, und er ist voller Möglichkeiten.`, `~5`,
      `Hier liegen alle Ideen, die du je hattest. Und alle, die noch kommen werden.`, `~4`,
      `Du musst nichts erzwingen. Ideen kommen, wenn du entspannt bist. So wie jetzt.`, `~4`,
      `Denk an dein Vorhaben. Und dann lass los und schau einfach, was auftaucht. Ein Bild, ein Wort, eine Farbe, ein Gefühl.`, `~12`,
      `Sammle, was dir begegnet, ohne es zu bewerten.`, `~6`,
      c.SIT ? [sitIntro, `Ab jetzt erinnerst du dich dort an diese Werkstatt. Die Tür steht dir immer offen.`, `~4`] : [],
      `In den nächsten Tagen fallen dir Ideen ganz leicht ein. Beim Spazierengehen, kurz vor dem Einschlafen, wenn du gar nicht damit rechnest.`, `~4`,
      long ? [`Geh noch einmal in deine Werkstatt. Nimm eine der Ideen in die Hand. Dreh sie, betrachte sie von allen Seiten.`, `Was wird daraus, wenn du sie weiterspinnst?`, `~12`] : []
    ],
    eigenes: () => [
      resourcePart,
      `Spür dieses Gefühl jetzt wieder. Lass es mit jedem Atemzug ein bisschen stärker werden.`, `~5`,
      `Stell dir vor, es ist einige Zeit später, und dein Anliegen hat sich erfüllt.`,
      `Wie sieht das aus? Was ist anders?`, `~5`,
      `Du bist ${c.F}. Spür, wie sich das anfühlt.`, `~5`,
      c.SIT ? [sitIntro, `Erlebe diesen Moment jetzt neu, mit diesem Gefühl.`, `~6`] : [],
      `Dein Unterbewusstsein kennt den Weg. Es arbeitet weiter für dich, auch wenn du nicht daran denkst.`, `~4`,
      long ? [`Geh den Weg in Gedanken noch einmal, Schritt für Schritt. Und spür, wie leicht er sich anfühlt.`, `~10`] : []
    ]
  }[t] || (() => []);
  const seed = c.r.minutes >= 30 && t !== "trance" ? [
    `Stell dir vor, alles, was du heute erlebt hast, ist wie ein Samen.`,
    `Er sinkt jetzt tief hinein in warme, fruchtbare Erde.`, `~4`,
    `Dort schlägt er Wurzeln. Ganz still und ganz von allein.`, `~4`,
    `Du musst nichts dafür tun. Du musst nicht einmal daran denken.`,
    `Mit jedem Tag wächst er ein Stück. Mit jedem Atemzug, mit jeder Nacht.`, `~5`,
    `Und eines Tages merkst du, dass das Neue einfach da ist. Als wäre es nie anders gewesen.`, `~5`
  ] : [];
  const timeline = c.r.minutes >= 45 && t !== "schlaf" ? [
    `Stell dir jetzt einen Weg vor, der vor dir liegt. Er führt in deine Zukunft, Tag für Tag.`,
    `Geh ein paar Schritte darauf. Mit jedem Schritt bist du ein paar Tage weiter.`, `~4`,
    `Und mit jedem Tag ist das Neue ein bisschen selbstverständlicher. Du bist ${c.F}, ganz natürlich.`, `~5`,
    `Schau dich um. Was hat sich verändert? Wie gehst du mit dir um?`, `~6`,
    `Geh weiter, bis zu einem Tag in ein paar Wochen. Dort ist das alles längst ein Teil von dir.`, `~6`,
    `Und jetzt komm in Gedanken zurück an deinen Wohlfühlort. Und nimm alles mit.`, `~4`
  ] : [];
  const wave = c.r.minutes >= 60 ? [
    `Und jetzt lass eine zweite, noch tiefere Welle der Entspannung durch deinen Körper fließen.`,
    `Sie beginnt bei deinen Füßen. Warm und weich.`, `~5`,
    `Sie steigt langsam in deine Waden, in deine Knie, in deine Oberschenkel.`, `~6`,
    `In dein Becken und deinen Bauch. Alles wird noch ein Stück weicher.`, `~6`,
    `In deine Brust, in deine Schultern, deine Arme hinunter bis in die Hände.`, `~6`,
    `In deinen Nacken, in dein Gesicht, bis hinauf zum Scheitel.`, `~6`,
    `Dein ganzer Körper ist jetzt eingehüllt in diese Wärme. Tiefer entspannt als je zuvor heute.`, `~8`
  ] : [];
  const again = c.r.minutes >= 60 ? [
    `Und jetzt gehst du noch einmal tiefer, damit sich alles gut setzen kann.`,
    `Stell dir vor, du stehst wieder am Anfang deines Weges nach unten. Und diesmal geht es noch leichter.`, `~3`,
    `Mit jedem Atemzug ein Stück tiefer. Weich und sicher.`, `~5`,
    `Tiefer, als du heute schon warst.`, `~6`,
    `Und hier, in dieser Tiefe, wirkt alles noch stärker.`, `~5`
  ] : [];
  const rest = c.r.minutes >= 60 ? [
    `Bleib jetzt einfach hier, in dieser tiefen, ruhigen Trance.`,
    `Es gibt nichts zu tun. Lass alles wirken.`, `~15`,
    `Tiefer und ruhiger.`, `~15`,
    `Ganz still.`, `~15`,
    `Alles, was du heute erlebt hast, sinkt jetzt tief in dich hinein.`, `~15`
  ] : [];
  const ok = c.r.checkLevel === "normal" && c.r.minutes >= 20 ? [`CHECK:ok`] : [];
  const ideo = c.r.interactions.includes("ideo");
  return [head, ok, ideo ? `CHECK:ideo` : [], wave, body(), again, seed, timeline, rest, ideo ? `CHECK:ideo2` : []];
}

function anchorUse(c) {
  return {
    finger: "Du legst Daumen und Zeigefinger zusammen",
    herz: "Du legst die Hand aufs Herz",
    atem: "Du atmest einmal bewusst und tief ein und aus",
    wort: `Du sagst innerlich ${c.AW}`
  }[c.r.anchor];
}

function bVerankerung(c, min) {
  const long = min >= 3;
  const quick = c.r.minutes <= 10;
  const del = c.r.deleteAll;
  const sugg = quick ? c.suggestions.slice(0, (c.r.affirmations.length || c.r.trigger) ? 2 : 3) : c.suggestions;
  const affs = quick ? c.r.affirmations.slice(0, 3) : c.r.affirmations;
  const lines = [`#Verankerung|8`, V(`Ich gebe dir jetzt ein paar Sätze mit. Lass sie einfach in dich hineinsinken.`, `Jetzt kommen ein paar Sätze für dich. Du musst nichts damit tun, sie sinken von allein.`, `Hör jetzt einfach zu. Diese Sätze finden ihren Weg ganz von allein.`), `~3`];
  sugg.slice().sort(() => RND() - 0.5).forEach(s => lines.push(s, "~4"));
  if (c.r.minutes >= 30) {
    lines.push(`Noch einmal. Und diesmal sinken die Sätze noch tiefer.`, `~3`);
    sugg.slice(0, 3).forEach(s => lines.push(s, "~5"));
  }
  if (affs.length) {
    lines.push(`Und jetzt deine eigenen Sätze. Sprich sie innerlich mit.`, `~2`);
    affs.forEach(s => lines.push(s, "~4"));
    if (long && !quick) { lines.push(`Noch einmal.`, `~2`); affs.forEach(s => lines.push(s, "~4")); }
  }
  if (quick) lines.push(`Dein Kernsatz lautet: ${c.focus} Sag ihn dir innerlich.`, `~5`);
  else lines.push(`Dein Kernsatz lautet: ${c.focus}`, `~3`, `Sag ihn dir innerlich: ${c.focus}`, `~5`);
  if (c.r.taskPlan.includes("wort")) lines.push(`Und dein eigenes Wort ist auch dabei: „{WORT}“.`, `~3`);
  if (c.r.taskPlan.includes("farbe")) lines.push(`Deine Farbe {FARBE} umhüllt alles, was du heute mitnimmst.`, `~3`);
  const ad = c.r.adapt || {};
  if (ad.favWord && !c.r.taskPlan.includes("wort")) lines.push(`Und dein Wort aus den letzten Sessions ist wieder dabei: „${ad.favWord}“.`, `~3`);
  if (c.r.trigger) {
    lines.push(
      del ? `Und hier ist die Suggestion, die du dir selbst ausgesucht hast. Sie gilt für diese Session:` : `Und noch etwas nimmst du mit. Eine Suggestion, die du dir selbst ausgesucht hast:`,
      c.r.trigger, `~4`,
      del ? `Spür, wie sie sich anfühlt.` : `Sie wirkt ganz von allein, jedes Mal, wenn der Moment kommt.`, `~3`
    );
  }
  const a = c.r.anchor;
  const open = `Und jetzt, während du ${c.FN} ganz deutlich spürst,`;
  const future = del
    ? [`Für den Rest dieser Session holt dir diese Geste das Gefühl zurück. Am Ende löst sich die Verbindung wieder.`, `~4`]
    : null;
  if (a === "herz") lines.push(
    `${open} leg eine Hand auf dein Herz.`, `~3`,
    `Spür die Wärme deiner Hand. Spür deinen Herzschlag, ruhig und gleichmäßig.`,
    `Das Gefühl verbindet sich jetzt mit dieser Berührung.`, `~5`,
    future || [`Wann immer du in Zukunft deine Hand so auf dein Herz legst, kommt dieses Gefühl zurück.`, `Jedes Mal ein bisschen schneller. Und jedes Mal ein bisschen stärker.`, `~4`],
    `Du kannst die Hand jetzt wieder sinken lassen.`, `~3`);
  else if (a === "atem") lines.push(
    `${open} nimm einen bewussten, tiefen Atemzug.`, `~4`,
    `Und während du langsam ausatmest, verbindet sich dieses Gefühl mit deinem Atem.`, `~5`,
    future || [`Wann immer du in Zukunft so bewusst und tief einatmest und langsam ausatmest, kommt dieses Gefühl zurück.`, `Jedes Mal ein bisschen schneller. Und jedes Mal ein bisschen stärker.`, `~4`]);
  else if (a === "wort") lines.push(
    `${open} bekommt dieses Gefühl ein Wort.`,
    `Dein Wort ist: ${c.AW}.`, `~2`,
    `Sag es innerlich: ${c.AW}.`, `~4`,
    `Und noch einmal: ${c.AW}.`, `~4`,
    future || [`Wann immer du in Zukunft innerlich ${c.AW} sagst, kommt dieses Gefühl zurück.`, `Jedes Mal ein bisschen schneller. Und jedes Mal ein bisschen stärker.`, `~4`]);
  else lines.push(
    `${open} leg Daumen und Zeigefinger einer Hand sanft aneinander.`, `~3`,
    `Drück sie ganz leicht zusammen und spür, wie sich das Gefühl mit dieser Berührung verbindet.`, `~5`,
    future || [`Wann immer du in Zukunft Daumen und Zeigefinger so zusammenlegst, kommt dieses Gefühl zurück.`, `Jedes Mal ein bisschen schneller. Und jedes Mal ein bisschen stärker.`, `~4`],
    `Du kannst die Finger jetzt wieder lösen.`, `~3`);
  if (!quick || !c.r.trigger) lines.push(...bWennDann(c));
  if (c.r.checkLevel === "normal" && c.r.ending !== "schlaf") lines.push(`CHECK:gefuehl`);
  return lines;
}

function bZukunft(c) {

    `#Zukunft|5`,

    `${use}, und das Gefühl ist da. Du bist ${c.F}.`, `~4`,

    ] : [],
    `Mit jedem Tag wird es selbstverständlicher. Bis es einfach ein Teil von dir ist.`, `~4`,

}

function bRueckkehr(c) {
  const r = c.r;
  const wake = c.avoid.has("zaehlen") && ["zehn", "fuenf", "drei"].includes(r.wake) ? "einfach" : r.wake;
  const benommen = c.tt.has("benommen");
  const pre = [
    `#Rückkehr|0`,
    V(`Gleich kommst du zurück ins Hier und Jetzt.`, `Bald ist es Zeit, zurückzukommen.`, `Gleich machst du dich auf den Weg zurück.`),
    r.topic === "trance" ? [`Alle Trance-Erfahrungen von heute sind vollständig aufgelöst. Dein Körper fühlt sich ganz normal an.`, `Sie werden zu einer schönen Erinnerung. Du verpasst nichts: In einer neuen Session kannst du sie jederzeit wieder erleben.`] : "",
    r.topic === "rolle" ? `Deine Rolle von heute hast du ganz abgelegt. Du bist wieder ganz du selbst, mit allem, was dich ausmacht.` : "",
    r.deleteAll ? `Alle Anker und Auslöser aus dieser Session lösen sich jetzt auf. Nur das gute Gefühl bleibt.` : "",
    triggerEnd(c),
    V(`Alles Gute, das du heute erlebt hast, nimmst du mit.`, `Alles, was dir heute gutgetan hat, nimmst du mit.`, `Das Gute aus dieser Session kommt mit dir.`),
    `Es wirkt weiter, ganz von allein. In den nächsten Stunden, Tagen und Wochen.`,
    r.minutes <= 10 ? "" : `Und je öfter du übst, desto leichter und tiefer wird deine Trance. Drei- bis fünfmal pro Woche ist ideal.`,
    c.tt.has("amnesie") ? `Und du darfst dich an alles erinnern, was für dich wichtig ist.` : "",
    `~4`,
    benommen ? [`Lass dir Zeit. Es gibt keine Eile.`, `~2`] : []
  ];
  const post = [
    benommen ? [`Lass dir noch einen Moment Zeit. Spür deine Füße auf dem Boden.`, `Schau dich im Raum um und nenn in Gedanken drei Dinge, die du siehst.`, `~5`] : [],
    V(`{N}willkommen zurück.`, `{N}schön, dass du wieder da bist.`, `{N}willkommen zurück im Hier und Jetzt.`),
    r.topic === "trance" || r.topic === "rolle" || (r.minutes > 10 && !r.selfPractice) ? [`Prüf kurz nach: Beweg deine Hände und Arme. Sie sind ganz normal, leicht und beweglich. Dein Kopf ist klar.`, `~3`] : [],
    V(`Nimm dir noch einen Moment, bevor du aufstehst.`, `Lass dir noch einen Moment Zeit, bevor du aufstehst.`, `Bleib noch kurz liegen oder sitzen und spür nach.`)
  ];
  let mid;
  if (wake === "zehn" && r.minutes <= 10) mid = [
    `Ich zähle jetzt langsam bis zehn. Bei zehn bist du hellwach und erfrischt.`, `~2`,
    `Eins. Zwei. Dein Atem wird tiefer.`, `~3`,
    `Drei. Vier. Energie fließt in deine Arme und Beine.`, `~3`,
    `Fünf. Sechs. Bewege deine Finger und Zehen.`, `~3`,
    `Sieben. Acht. Dein Kopf wird klar.`, `~3`,
    `Neun. Zehn. Augen auf. Hellwach und erfrischt.`, `~3`
  ];
  else if (wake === "zehn") mid = [
    `Ich zähle jetzt langsam von eins bis zehn.`,
    `Bei zehn öffnest du die Augen und bist hellwach, erfrischt und klar.`, `~3`,
    `Eins. Du spürst wieder deinen Atem.`, `~3`,
    `Zwei. Du spürst die Unterlage unter dir.`, `~3`,
    `Drei. Energie fließt in deine Beine.`, `~3`,
    `Vier. In deine Arme und Hände.`, `~3`,
    `Fünf. Bewege sanft deine Finger und deine Zehen.`, `~3`,
    `Sechs. Dein Kopf wird klar.`, `~3`,
    `Sieben. Du hörst die Geräusche um dich herum.`, `~3`,
    `Acht. Atme tief ein und streck dich, wenn du magst.`, `~3`,
    `Neun. Fast da. Deine Augen sind bereit.`, `~3`,
    `Zehn. Augen auf. Hellwach, klar und erfrischt.`, `~3`
  ];
  else if (wake === "drei") mid = [
    `Ich zähle jetzt bis drei. Bei drei öffnest du die Augen und bist hellwach.`, `~2`,
    `Eins. Energie kehrt in deinen Körper zurück.`, `~3`,
    `Zwei. Du atmest tief ein und spürst den Raum um dich herum.`, `~3`,
    `Drei. Augen auf. Hellwach und erfrischt.`, `~3`

  else if (wake === "einfach") mid = [

    `Eins. Du spürst den Boden unter dir.`, `~2`,
    `Zwei. Dein Atem wird kräftiger.`, `~2`,
    `Drei. Bewege sanft deine Finger und Zehen.`, `~2`,
    `Vier. Du hörst die Geräusche um dich herum.`, `~2`,
    `Fünf. Augen auf. Hellwach, klar und erfrischt.`, `~3`

  else if (wake === "schnips") mid = [
    `Spür wieder den Boden unter dir. Dein Atem wird tiefer und kräftiger.`, `~3`,

    `Atme einmal tief ein.`, `~2`,

  else mid = [
    `Ich zähle jetzt von eins bis fünf.`,
    `Bei fünf öffnest du die Augen und bist hellwach, erfrischt und voller Energie.`, `~3`,
    `Eins. Du spürst wieder den Boden unter dir und die Unterlage, auf der du liegst oder sitzt.`, `~3`,
    `Zwei. Dein Atem wird tiefer und kräftiger. Die Energie kehrt in deinen Körper zurück.`, `~3`,
    `Drei. Bewege sanft deine Finger und deine Zehen. Vielleicht möchtest du dich ein wenig strecken.`, `~3`,
    `Vier. Du hörst die Geräusche um dich herum. Du bist fast ganz da.`, `~3`,
    `Fünf. Augen auf. Hellwach, klar und erfrischt.`, `~3`
  ];
  return [pre, mid, post];
}

function bNachsorge() {
  return [
    `#Nachsorge|0`,
    `Bleib noch einen Moment sitzen oder liegen, bevor du aufstehst.`,

    `Alles, was gut war, bleibt bei dir.`

}

function bSchlaf(c) {
  return [
    `#In den Schlaf|10`,

    `Es gibt nichts mehr zu tun und nichts mehr zu denken.`,
    c.r.topic === "trance" ? `Alle Trance-Erfahrungen von heute sind aufgelöst. Dein Körper ist frei und entspannt.` : "",
    c.r.deleteAll ? `Alle Anker und Auslöser aus dieser Session lösen sich im Schlaf auf.` : "",
    triggerEnd(c),
    `Alles Gute, das du heute erlebt hast, wirkt in dir weiter. Auch im Schlaf.`, `~5`,
    sleepDeeper(c, false),
    `Falls du in der Nacht aus irgendeinem Grund wach sein musst, bist du sofort klar und aufmerksam.`,
    `Und danach schläfst du ganz leicht wieder ein.`, `~5`,
    c.r.minutes >= 45 ? [
      `!zaehlen:Ich zähle jetzt ganz langsam von zwanzig bis eins. Du musst nicht mitzählen. Mit jeder Zahl sinkst du tiefer in den Schlaf.`,

      ...["Zwanzig", "Neunzehn", "Achtzehn", "Siebzehn", "Sechzehn", "Fünfzehn", "Vierzehn", "Dreizehn", "Zwölf", "Elf", "Zehn", "Neun", "Acht", "Sieben", "Sechs", "Fünf", "Vier", "Drei", "Zwei", "Eins"]
        .flatMap((w, i) => [c.avoid.has("zaehlen") ? (i % 4 === 0 ? "Tiefer." : "") : `${w}.`, i % 5 === 4 ? "~8" : "~5"])
    ] : [],
    `LEISER`,
    `Meine Stimme wird jetzt leiser und leiser.`, `~4`,
    `Und du gleitest sanft hinüber in einen tiefen, erholsamen Schlaf.`, `~8`,

}

/* Ende-Baustein als fertiger Text (für Claude-Skripte ohne sauberes Ende) */
function offlineEnding(input) {
  const c = makeCtx(input, null);
  if (c.r.ending === "schlaf") return renderLines(bSchlaf(c), c);
  return renderLines([bRueckkehr(c), c.r.aftercare ? bNachsorge() : []], c);
}

function buildOfflineScript(input, ev, opts = {}) {
  RND = seededRandom(opts.seed != null ? opts.seed : Math.floor(Math.random() * 4294967296));
  /* Die eingebauten Bausteine sind deutsch; englische Sessions werden danach übersetzt */
  const prevLang = typeof SLANG !== "undefined" ? SLANG : null;
  if (prevLang !== null) SLANG = "de";
  try { return buildOfflineScriptInner(input, ev, opts); } finally { RND = Math.random; if (prevLang !== null) SLANG = prevLang; }
}
function buildOfflineScriptInner(input, ev, opts) {
  const c = makeCtx(input, ev);
  const phases = computePhases(c.r);
  const min = (key) => (phases.find(p => p.key === key) || { minutes: 0 }).minutes;
  if (opts.demo) {
    return renderLines([
      `#Ankommen|1`,
      `{N}schön, dass du da bist. Das hier ist eine kurze Probe.`,
      `Mach es dir bequem und schließ, wenn du magst, die Augen.`, `~3`,

      `Atme tief ein.`, `~4`, `Und langsam wieder aus.`, `~5`,
      `Noch einmal. Einatmen.`, `~4`, `Und ausatmen. Ganz lang und langsam.`, `~5`,
      `#Entspannung|3`,
      `Deine Stirn wird glatt. Dein Kiefer wird locker.`, `~3`,
      `Deine Schultern sinken ein kleines Stück nach unten.`, `~3`,
      `Deine Arme und Hände werden schwer und warm.`, `~4`,
      `Die Ruhe fließt durch deinen Bauch und deine Beine, bis hinunter in deine Füße.`, `~5`,
      `CHECK:tiefe`,
      `#Wohlfühlort|6`,
      `Stell dir vor, du stehst auf einer Lichtung, mitten in einem alten, friedlichen Wald.`,
      `Sonnenstrahlen fallen durch die Blätter und malen helle Flecken auf das Moos.`, `~3`,
      `Die Blätter rascheln leise im Wind.`, `~3`,
      `Der Boden ist weich unter deinen Füßen, und die Luft ist frisch.`, `~4`,
      `Hier bist du vollkommen sicher. Bleib einen Moment und genieß die Ruhe.`, `~6`,
      c.r.wakeCycles ? [bWach(c, 1), bZurueck(c, 1)] : [],
      `In deiner eigenen Session gehen wir noch viel tiefer. Mit deinem Thema, deinen Bildern und deinen Sätzen.`, `~4`,
      `CHECK:bereit`,
      bRueckkehr(c)
    ], c);
  }
  const wake = (k) => k <= c.r.wakeCycles ? [bWach(c, k), bZurueck(c, k)] : [];
  if (c.r.selfPractice) return renderLines([bAnkommen(c, min("ank")), bSelbstUeben(c), bRueckkehr(c)], c);
  const blocks = [
    bAnkommen(c, min("ank")),
    bEinleitung(c, min("ent")),
    bVertiefung(c),
    bSerieLernen(c),
    wake(1),
    bOrt(c, min("ort")),
    bAsmrKribbeln(c),
    bSerieTiefer(c),
    bDrop(c),
    wake(2),
    bSerieKern(c),
    bWahl(c),
    bKern(c, min("kern")),
    c.r.minutes >= 30 ? bDrop(c) : [],
    wake(3),
    bVerankerung(c, min("ank2")),
    bSerieWiederholung(c),
    bSelbstSchluessel(c)
  ];
  if (c.r.ending === "schlaf") blocks.push(bSerieAusblick(c), bSchlaf(c));
  else {
    blocks.push(bZukunft(c), bSerieAusblick(c), bRueckkehr(c));
    if (c.r.aftercare) blocks.push(bNachsorge());
  }
  return renderLines(blocks, c);
}

/* Wortziel für Claude: Wachphasen und Atem-Kopplung bringt die App selbst mit */
function scriptWordTarget(input) {

}

/* Antwort auswerten: { label, lines, followUp?, abort? } */
function checkResponse(kind, taps, c) {
  const n = Math.max(0, Math.min(3, taps | 0));

  const label = (CHECK_LABELS[kind] || {})[n] || "";

    case "tiefe":

      if (n === 3) return { label, lines: [`Wunderbar. Genieß diese Tiefe. Hier wirkt alles besonders gut.`, `~3`] };

      return n ? { label, lines: [`Sehr schön. Genau so.`, `~2`] } : { label, lines: [`Auch gut. Jede Tiefe ist richtig, und auch so wirkt die Session.`, `~3`] };

    case "ok":
      if (two === 2) return { label, lines: [

    case "ende":

        ? [`Gut. Dann machen wir ganz sanft weiter. Und du kannst jederzeit aufhören.`, `~3`]
        : [`Dann machen wir ganz sanft weiter. Wenn du aufhören möchtest, halte einfach zwei Sekunden lang den Finger auf den Bildschirm.`, `~3`] };

    case "gefuehl":
      if (n === 1 || n === 3) return { label, lines: [`Wunderbar. Halte es fest. Es gehört jetzt dir.`, `~3`] };

        `Dann lass es mit jedem Atemzug ein bisschen wachsen.`, `~3`,

      return { label, lines: n ? [`Gut. Dann kommst du jetzt langsam zurück.`, `~2`] : [`Dann kommst du jetzt ganz langsam zurück.`, `~2`] };
    case "lider":
      if (n === 1) return { label, lines: [`Wunderbar. Deine Lider bleiben ganz von allein geschlossen. So tief bist du schon.`, `~3`] };
      if (two === 2) return { label, lines: [`Gut, dass du es ausprobiert hast. Schließ die Augen jetzt wieder.`, `~2`, `Und mit dem Schließen gehst du doppelt so tief. Jedes Öffnen bringt dich nur noch tiefer.`, `~4`] };

const cleanWord = (s) => String(s || "").replace(/[^\p{L}\p{M}\s'-]/gu, " ").replace(/\s+/g, " ").trim().split(" ").slice(0, 3).join(" ").slice(0, 24).trim();

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

}

    strecken: [`Streck dich einmal ausgiebig. Roll die Schultern, beweg deine Finger und deine Zehen.`, `Wenn du fertig bist, tippe auf Fertig.`],
    umsehen: [`Schau dich im Raum um und such dir drei Dinge aus, die dir gerade auffallen. Eine Farbe, eine Form, ein Licht.`, `Tippe für jedes Ding einmal auf einen Kreis.`],
    punkte: [`Auf dem Bildschirm erscheinen gleich drei Lichtpunkte, einer nach dem anderen.`, `Tippe jeden an, sobald du ihn siehst.`],
    schreiben: [`Auf dem Bildschirm steht dein Satz. Schreib ihn ab. Und dann noch einmal. Und noch einmal.`, `Mit jedem Mal sinkt er tiefer in dich hinein. Schreib einfach weiter, bis ich dich zurückhole.`],
    zahl: [`Auf dem Bildschirm steht eine Zahl. Merk sie dir gut.`, `Tippe auf Gemerkt, wenn du sie dir eingeprägt hast.`],
    zahlfrage: [`Erinnerst du dich an die Zahl von vorhin?`, `Wähl sie auf dem Bildschirm aus. Oder tippe auf Weiß nicht mehr.`],
    sprechen: [`Auf dem Bildschirm steht dein Satz. Sprich ihn laut aus. Und dann noch einmal. Und noch einmal.`, `Mit jedem Mal sinkt er tiefer in dich hinein. Sprich einfach weiter, bis ich dich zurückhole.`],
    sagen: [`Welches Wort beschreibt, wie du dich gerade fühlst?`, `Sag es einfach laut.`]
  }[kind] || [`Tippe auf Fertig, wenn du so weit bist.`];
  return [`Eine kleine Aufgabe für dich.`, q];
}

function taskData(kind, vars, c) {
  if (kind === "zahl") {
    let n;
    do { n = 12 + Math.floor(Math.random() * 87); } while (n % 10 === 0 || n % 11 === 0);
    return { number: n };
  }
  if (kind === "zahlfrage") {
    const n = Number(vars.ZAHL);
    const rev = Number(String(n).split("").reverse().join(""));
    const decoys = [];
    for (const x of [rev, n + 10, n - 10, n + 3, n - 4, n + 21, n - 13, n + 7]) {
      if (x >= 10 && x <= 99 && x !== n && !decoys.includes(x) && decoys.length < 3) decoys.push(x);
    }
    return { number: n, options: shuffled([n, ...decoys]) };
  }
  if (kind === "schreiben") {
    /* Zufälliger Satz: eigene Sätze, Kernsatz und die Suggestionen der Session, nicht zweimal hintereinander */
    const pool = [...new Set([
      ...[].concat(c.r.affirmations || []).flatMap(x => String(x).split(/\n+/)),
      c.focus,
      ...(c.suggestions || []),
      ...((TOPIC_INFO[c.r.topic] || {}).sugg || []).map(x => Array.isArray(x) ? x[1] : x)
    ].map(x => String(x || "").trim()).filter(x => x.length >= 6 && x.length <= 90))];
    const fresh = pool.filter(x => x !== vars.LASTSATZ);
    const list = fresh.length ? fresh : pool;
    const sentence = list[Math.floor(Math.random() * list.length)] || c.focus;
    return { sentence, seconds: c.r.minutes <= 10 ? 50 : c.r.minutes >= 45 ? 120 : 90, progress: { count: 0 } };
  }
  if (kind === "farbe") return { colors: COLORS };
  if (kind === "sprechen") return Object.assign(taskData("schreiben", vars, c), { spoken: true });
  if (kind === "sagen") return Object.assign(taskData("wort", vars, c), { spoken: true });
  if (kind === "wort") return { suggestions: [...new Set([...(c.r.feelings || []), "ruhig", "leicht", "warm", "weit", "schwer", "frei"])].slice(0, 6) };
  return {};
}

/* Antwort auf eine Aufgabe: { label, lines, vars } */
function taskResponse(kind, res, c, data) {
  data = data || {};
  if (kind === "zahl" && data.number) {
    return (res && res.done && !res.skipped)
      ? { label: "Zahl gemerkt", vars: { ZAHL: data.number }, lines: [`Gut.`, `~1`] }
      : { label: res && res.skipped ? "übersprungen" : "keine Antwort", vars: { ZAHL: data.number }, lines: [`Auch gut.`, `~1`] };
  }
  if (kind === "sprechen" && !(res && res.skipped)) {
    const n = (data.progress && data.progress.count) || 0;
    if (n > 0) return { label: `${n}× laut gesagt: „${data.sentence}“`, vars: { SATZ: 1, LASTSATZ: data.sentence }, lines: [`Genug gesprochen. ${(["", "Einmal", "Zweimal", "Dreimal", "Viermal", "Fünfmal", "Sechsmal", "Siebenmal", "Achtmal", "Neunmal", "Zehnmal"][n]) || n + " Mal"} hast du deinen Satz laut gesagt, und er klingt in dir weiter.`, `~1`] };
  }
  if (kind === "sagen") kind = "wort";
  if (kind === "schreiben" && !(res && res.skipped)) {
    const n = (data.progress && data.progress.count) || 0;
    if (n > 0) return { label: `${n}× „${data.sentence}“`, vars: { SATZ: 1, LASTSATZ: data.sentence }, lines: [`Genug geschrieben. ${(["", "Einmal", "Zweimal", "Dreimal", "Viermal", "Fünfmal", "Sechsmal", "Siebenmal", "Achtmal", "Neunmal", "Zehnmal", "Elfmal", "Zwölfmal"][n]) || n + " Mal"} steht dein Satz jetzt da, und noch viel öfter in dir.`, `~1`] };
  }
  if (!res || !res.done) return { label: "keine Antwort", vars: {}, lines: [`Gut. Du musst nichts tun.`, `~1`] };
  if (res.skipped) return { label: "übersprungen", vars: {}, lines: [`Auch gut.`, `~1`] };
  switch (kind) {
    case "farbe": {
      const col = (COLORS.find(x => x.v === res.value) || {}).v;
      if (!col) return { label: "keine Farbe", vars: {}, lines: [`Auch gut.`, `~1`] };
      return { label: col, vars: { FARBE: col }, lines: [`${col}. Schön.`, `Diese Farbe nimmst du gleich mit in die Tiefe.`, `~1`] };
    }
    case "wort": {
      const w = cleanWord(res.value);
      if (!w) return { label: "kein Wort", vars: {}, lines: [`Auch gut.`, `~1`] };
      return { label: `„${w}“`, vars: { WORT: w }, lines: [`„${w}“. Danke.`, `Dieses Wort nimmst du gleich mit in die Tiefe.`, `~1`] };
    }
    case "strecken":
      return { label: "erledigt", vars: {}, lines: [`Schön. Spür, wie lebendig dein Körper ist.`, `~1`] };
    case "umsehen":
      return { label: "drei Dinge entdeckt", vars: {}, lines: [`Gut. Spür, wie klar und wach du gerade bist.`, `~1`] };
    case "punkte": {
      const t = (res.times || []).filter(x => Number.isFinite(x) && x > 0);
      const avg = t.length ? t.reduce((a, b) => a + b, 0) / t.length : 0;
      return {
        label: t.length ? `${t.length} von 3 gefangen, im Schnitt nach ${(avg / 1000).toFixed(1).replace(".", ",")} Sekunden` : "erledigt",
        vars: {}, lines: [`Gut gefangen. Dein Kopf ist ganz klar.`, `~1`]
      };
    }
    case "zahlfrage": {
      const n = data.number;
      if (res.value === "weiss") return { label: "vergessen", vars: {}, lines: [`Sie ist einfach verblasst. Genau so kann eine tiefe Trance wirken.`, `Es war die ${n}. Und jetzt ist die Erinnerung wieder ganz normal da.`, `~1`] };
      if (Number(res.value) === n) return { label: "richtig erinnert", vars: {}, lines: [`Richtig, es war die ${n}. Dein Gedächtnis ist hellwach, und auch das ist völlig in Ordnung.`, `~1`] };
      return { label: "anders erinnert", vars: {}, lines: [`Es war die ${n}. Spannend, oder? Die Trance hat sie ein wenig verschwimmen lassen.`, `Jetzt ist die Erinnerung wieder ganz normal da.`, `~1`] };
    }
  }
  return { label: "erledigt", vars: {}, lines: [] };
}

/* Ohne Mitmach-Elemente: ein fester Countdown statt Zählen bis zum Tippen */
function selfDepthFallback(c) {
  return [countDown(["", "Tiefer.", "", "Doppelt so tief.", "", "Ganz weich.", "", "Tiefer und tiefer.", "", "Ganz unten."], c), `~2`];
}
function selfDepthResponse(c, at, total) {
  if (at == null) return { label: "bis ganz unten", value: 0, lines: [`Ganz unten. Tiefer geht es heute nicht, und das ist wunderbar.`, `~3`] };

  };

/* =====================================================================
   Für Skripte von Claude: fehlende Mitmach-Marker und die Wachphasen ergänzen
   ===================================================================== */
/* Englische oder abgewandelte Marker vereinheitlichen */
function normalizeMarkers(text) {
  return String(text || "")
    .replace(/\[\s*(?:BREATH(?:ING)?(?:[- ]?COUPLING)?|ATMUNG)\s*\]/gi, "[ATEM]")
    .replace(/\[\s*SELF[- ]?(?:CHOSEN[- ]?)?DEPTH\s*\]/gi, "[SELBSTTIEFE]")
    .replace(/\[\s*(?:QUIETER|SOFTER|LEISER WERDEN)\s*\]/gi, "[LEISER]")
    .replace(/\[\s*(?:FINGER[- ]?SNAP|SNAPS)\s*\]/gi, "[SNAP]")
    .replace(/\[\s*(?:QUESTION|ASK)\s+([^\]]+)\]/gi, "[CHECK $1]")
    .replace(/\[\s*PAUSE\s*(\d+(?:[.,]\d+)?)\s*(?:sec(?:ond)?s?)\s*\]/gi, "[PAUSE $1]")
    .replace(/\(\s*Depth\s*[:=]?\s*(\d+(?:[.,]\d+)?)\s*\)/gi, "(Tiefe $1)");
}

function ensureInteractive(script, input) {
  script = normalizeMarkers(script);
  if (typeof SLANG !== "undefined") SLANG = input && input.lang === "en" ? "en" : "de";
  const c = makeCtx(input, null);
  const r = c.r;
  const lines = String(script || "").split("\n");
  const heads = () => {
    const out = [];
    lines.forEach((l, i) => {
      const m = l.match(/^\s*#{1,6}\s*(.+)$/);
      if (!m) return;
      const d = m[1].match(/\(\s*(?:Tiefe|Depth)\s*[:=]?\s*(\d+(?:[.,]\d+)?)\s*\)/i);
      out.push({ i, title: m[1].replace(/\(\s*(?:Tiefe|Depth)[^)]*\)\s*$/i, "").trim().toLowerCase(), depth: d ? parseFloat(d[1].replace(",", ".")) : null });
    });
    return out;
  };
  let H = heads();
  if (!H.length) return script;
  const has = (re) => lines.some(l => re.test(l));
  const endOf = (k) => (k + 1 < H.length ? H[k + 1].i : lines.length);
  const secEnd = (k) => { let e = endOf(k); while (e > H[k].i + 1 && !lines[e - 1].trim()) e--; return e; };
  const find = (re) => H.findIndex(h => re.test(h.title));
  const isEnd = (t) => /rückkehr|aufwach|in den schlaf|nachsorge|zurück(?! in die tiefe)|\breturn|wak(e|ing) up|coming back|into sleep|aftercare/.test(t);
  const deepIdx = () => { let k = find(/vertief|treppe|aufzug|wolke|pfad|countdown|deepen|stair|lift|elevator|cloud|path/); if (k < 0) k = H.findIndex(h => (h.depth || 0) >= 5 && !isEnd(h.title)); return k; };
  const insert = (at, arr) => { lines.splice(at, 0, ...arr); H = heads(); };

  if (r.interactions.includes("atem") && !has(/^\s*\[\s*ATEM/i)) {
    let at = -1;
    for (let i = H[0].i + 1; i < endOf(0); i++) if (/\batm|\batem/i.test(lines[i]) && !/^\s*\[/.test(lines[i])) { at = i; break; }
    insert(at >= 0 ? at : secEnd(0), ["[ATEM]"]);
  }
  if (r.interactions.includes("selbsttiefe") && !has(/^\s*\[\s*SELBST/i)) {
    const ci = lines.findIndex(l => /^\s*\[\s*CHECK\s+tiefe\s*\]\s*$/i.test(l));
    if (ci >= 0) lines[ci] = "[SELBSTTIEFE]";
    else { const k = deepIdx(); if (k >= 0) insert(secEnd(k), ["[SELBSTTIEFE]"]); }
  }
  if (r.interactions.includes("lider") && !r.wakeCycles && !has(/^\s*\[\s*CHECK\s+lider/i)) {
    const si = lines.findIndex(l => /^\s*\[\s*(SELBST|CHECK\s+tiefe\b)/i.test(l));
    if (si >= 0) insert(si + 1, ["[CHECK lider]"]);
    else { const k = deepIdx(); if (k >= 0) insert(secEnd(k), ["[CHECK lider]"]); }
  }
  if (r.interactions.includes("ideo") && !has(/^\s*\[\s*CHECK\s+ideo/i)) {
    let k = H.findIndex(h => (h.depth || 0) >= 9 && !isEnd(h.title) && !/schlaf|sleep|tiefer als zuvor|deeper than before/.test(h.title));
    if (k < 0) k = find(new RegExp(c.info.core.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&")));
    if (k >= 0) {
      insert(secEnd(k), ["[CHECK ideo2]"]);
      let at = H[k].i + 1;
      while (at < lines.length && !lines[at].trim()) at++;
      if (/^\s*\[\s*CHECK\s+ok\b/i.test(lines[at] || "")) at++;
      insert(at, ["[CHECK ideo]"]);
    }
  }
  if (r.wakeCycles && !has(/^\s*\[\s*(AUFGABE|TASK)\b/i)) {
    const kv = deepIdx();
    const ko = find(/wohlfühl|ort\b|strand|wald|garten|wiese|hütte|platz|see\b|happy place|safe place|place\b|beach|forest|garden|meadow|cabin|lake/);
    let kk = H.findIndex(h => (h.depth || 0) >= 9 && !isEnd(h.title) && !/schlaf|sleep/.test(h.title));
    const ka = find(/verank|anker|anchor/);
    if (ka > 0 && (kk < 0 || kk >= ka)) kk = ka - 1;
    const plan = [kv, ko, kk].slice(0, r.wakeCycles)
      .map((k, j) => ({ k, cyc: j + 1 }))
      .filter((p, j, arr) => p.k >= 0 && !isEnd(H[p.k].title) && arr.findIndex(q => q.k === p.k) === j);
    plan.sort((a, b) => b.k - a.k).forEach(p => {
      const deeper = Math.min(10, Math.max(wakeDepth(p.cyc), (H[p.k].depth || 6) + 1.5));
      const block = renderLines([bWach(c, p.cyc), bZurueck(c, p.cyc)], c).replace(/^# (Tiefer als zuvor|Deeper than before) \(Tiefe [\d.]+\)/m, (m, t) => `# ${t} (Tiefe ${deeper})`);
      insert(endOf(p.k), block.split("\n"));
    });
  }
  if (r.surpriseDrop && r.wakeCycles && has(/^\s*\[\s*(AUFGABE|TASK)\b/i) && !lines.some(l => /^(Doppelt so tief\. Ganz von allein|Twice as deep\. All by itself)\.$/.test(l))) {
    const drop = renderLines([bDrop(c)], c).split("\n");
    let kc = H.findIndex(h => (h.depth || 0) >= 9 && !isEnd(h.title) && !/schlaf|sleep|tiefer als zuvor|deeper than before|wachphase|wake phase/.test(h.title));
    if (r.minutes >= 30 && kc >= 0) {
      let e = secEnd(kc);
      while (e > H[kc].i + 1 && /^\s*\[\s*CHECK/i.test(lines[e - 1])) e--;
      insert(e, drop);
    }
    const ko = find(/wohlfühl|ort\b|strand|wald|garten|wiese|hütte|platz|see\b|happy place|safe place|place\b|beach|forest|garden|meadow|cabin|lake/);
    const firstTask = lines.findIndex(l => /^\s*\[\s*(AUFGABE|TASK)\b/i.test(l));
    if (ko >= 0 && H[ko].i > firstTask) {
      let e = secEnd(ko);
      while (e > H[ko].i + 1 && /^\s*\[\s*CHECK/i.test(lines[e - 1])) e--;
      insert(e, drop);
    }
  }
  if (r.wakeCycles && has(/^\s*\[\s*(AUFGABE|TASK)\b/i)) {
    let ke = -1;
    H.forEach((h, k) => { if (/rückkehr|aufwach|in den schlaf|zurück(?! in die tiefe)|\breturn|wak(e|ing) up|coming back|into sleep/.test(h.title)) ke = k; });
    if (ke >= 0 && !/tiefgang|trance deep/i.test(lines.slice(H[ke].i + 1).join("\n"))) insert(H[ke].i + 1, [renderLines([triggerEnd(c)], c)]);
  }
  return lines.join("\n");
}

/* =====================================================================
   Lernprofil: wertet alle bisherigen Durchläufe aus und leitet Anpassungen ab
   runs: [{ at, log, completed, played, minutes, topic, answers, feedback }]
   ===================================================================== */
function learnProfile(runs) {
  runs = (runs || []).filter(x => x && (x.log || x.feedback)).sort((a, b) => (a.at || 0) - (b.at || 0));
  if (!runs.length) return null;
  const count = (arr) => arr.reduce((m, v) => (m[v] = (m[v] || 0) + 1, m), {});
  const top = (m) => Object.entries(m).sort((a, b) => b[1] - a[1])[0];
  const median = (arr) => { if (!arr.length) return 0; const s = arr.slice().sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
  const recent = runs.slice(-6);
  const depths = runs.map(x => x.feedback && x.feedback.depth).filter(Boolean);
  const depthAvg = depths.length ? depths.reduce((a, b) => a + b, 0) / depths.length : 0;
  const lastDepths = recent.map(x => x.feedback && x.feedback.depth).filter(Boolean);
  const lastAvg = lastDepths.length ? lastDepths.reduce((a, b) => a + b, 0) / lastDepths.length : 0;
  const tiefeAwake = recent.filter(x => (x.log || []).some(l => l.kind === "tiefe" && l.taps === 1)).length;
  const emergencies = recent.filter(x => (x.log || []).some(l => l.kind === "notausstieg" || (l.kind === "ende" && l.taps >= 2))).length;
  const selfVals = runs.flatMap(x => (x.log || []).filter(l => l.kind === "selbsttiefe" && l.value > 0).map(l => l.value));
  const breaths = runs.flatMap(x => (x.log || []).filter(l => l.kind === "atem" && l.value > 0).map(l => l.value));
  const tasks = {};
  runs.forEach(x => (x.log || []).filter(l => l.kind === "aufgabe").forEach(l => {
    const t = l.task === "zahlfrage" ? "zahl" : l.task;
    const s = tasks[t] = tasks[t] || { done: 0, missed: 0, skipped: 0 };
    if (l.label === "keine Antwort") s.missed++; else if (l.label === "übersprungen") s.skipped++; else s.done++;
  }));
  const colors = count(runs.flatMap(x => (x.log || []).filter(l => l.kind === "aufgabe" && l.task === "farbe" && COLORS.some(c => c.v === l.label)).map(l => l.label)));
  const words = count(runs.flatMap(x => (x.log || []).filter(l => l.kind === "aufgabe" && l.task === "wort" && /^„.+“$/.test(l.label)).map(l => l.label.slice(1, -1))));
  const places = {}, phen = {};
  runs.forEach(x => {
    const a = x.answers || {};
    (x.log || []).forEach(l => {
      if (l.kind === "ort" && a.place) { const p = places[a.place] = places[a.place] || { good: 0, bad: 0 }; if (l.taps === 1) p.good++; else if (l.taps >= 2) p.bad++; }
      if (l.kind === "phaenomen" && l.ph) { const p = phen[l.ph] = phen[l.ph] || { yes: 0, no: 0 }; if (l.taps === 1) p.yes++; else if (l.taps >= 2) p.no++; }
    });
  });
  const experienced = [...new Set(runs.flatMap(x => (x.answers && x.answers.phenomena) || []))];
  const ratios = runs.map(x => x.feedback && x.feedback.guess && x.feedback.actual ? x.feedback.guess / x.feedback.actual : 0).filter(Boolean);
  const wishes = count(runs.flatMap(x => (x.feedback && x.feedback.changes) || []));
  const lider = runs.flatMap(x => (x.log || []).filter(l => l.kind === "lider" && l.taps > 0).map(l => l.taps === 1));
  const stress = runs.map(x => x.feedback && x.feedback.pre != null && x.feedback.post != null ? [x.feedback.pre, x.feedback.post] : null).filter(Boolean);
  /* beste Session: hohe Tiefe, zu Ende gehört */
  const scored = runs.filter(x => x.answers).map(x => ({ x, s: (x.feedback && x.feedback.depth || 3) + (x.completed ? 1 : -2) - ((x.log || []).some(l => l.kind === "notausstieg") ? 2 : 0) }));
  const best = scored.sort((a, b) => b.s - a.s || (b.x.at || 0) - (a.x.at || 0))[0];
  const minutesTop = top(count(runs.map(x => x.minutes).filter(Boolean)));

  const likedTasks = Object.entries(tasks).filter(([, s]) => s.done >= 1 && s.done >= s.missed + s.skipped).sort((a, b) => b[1].done - a[1].done).map(([t]) => t);
  const dislikedTasks = Object.entries(tasks).filter(([, s]) => s.skipped >= 2 && s.skipped > s.done).map(([t]) => t);
  const missedTotal = Object.values(tasks).reduce((n, s) => n + s.missed, 0);
  const doneTotal = Object.values(tasks).reduce((n, s) => n + s.done, 0);
  const fewerWakes = missedTotal >= 2 && missedTotal > doneTotal;
  const favColor = (top(colors) || [])[0] || "";
  const favWord = (top(words) || [])[0] || "";
  const badPlaces = Object.entries(places).filter(([, p]) => p.bad > p.good).map(([v]) => v);
  const goodPlaces = Object.entries(places).filter(([, p]) => p.good > p.bad).map(([v]) => v);
  const likedPh = Object.entries(phen).filter(([, p]) => p.yes > p.no).map(([v]) => v);
  const weakPh = Object.entries(phen).filter(([, p]) => p.no >= 2 && p.no > p.yes).map(([v]) => v);
  const moreDepth = (lastAvg && lastAvg <= 2.5) || tiefeAwake >= 2 || (wishes.tiefer || 0) >= 1 && (!lastAvg || lastAvg < 4);
  const gentle = emergencies >= 1;
  const timeRatio = ratios.length ? ratios.reduce((a, b) => a + b, 0) / ratios.length : 0;
  const susceptible = lider.length >= 2 && lider.filter(Boolean).length / lider.length >= 0.7;
  /* Ansprechbarkeit grob einschätzen: tiefe Trance, Lider zu, Phänomene gespürt */
  const highSigns = (susceptible ? 1 : 0) + (depthAvg >= 4 ? 1 : 0) + (likedPh.length >= 2 ? 1 : 0);
  const lowSigns = (depthAvg && depthAvg <= 2.5 ? 1 : 0) + (lider.length >= 2 && lider.filter(Boolean).length / lider.length <= 0.3 ? 1 : 0) + (weakPh.length >= 2 ? 1 : 0);
  const responder = runs.length >= 2 ? (highSigns >= 2 ? "hoch" : lowSigns >= 2 ? "niedrig" : "mittel") : "";
  const stressDrop = stress.length ? stress.reduce((n, [a, b]) => n + (a - b), 0) / stress.length : null;

  const learned = [];
  learned.push(`${runs.length} ${runs.length === 1 ? "Session" : "Sessions"} angehört${depthAvg ? `, Tiefe im Schnitt ${depthAvg.toFixed(1).replace(".", ",")} von 5` : ""}`);
  if (moreDepth) learned.push("Du darfst tiefer gehen: Ich baue mehr Vertiefung ein.");
  else if (depthAvg >= 4) learned.push("Du gehst schon sehr tief. Ich halte die Vertiefung so.");
  if (gentle) learned.push("Du hast zuletzt vorzeitig aufgehört. Ich baue mehr Sicherheit und sanftere Übergänge ein.");
  if (selfVals.length) learned.push(`Bei der selbst gewählten Tiefe tippst du meist um ${Math.round(median(selfVals))}.`);
  if (breaths.length) learned.push(`Dein Atemrhythmus: etwa alle ${median(breaths).toFixed(1).replace(".", ",").replace(",0", "")} Sekunden ein Atemzug.`);
  if (likedTasks.length) learned.push(`Aufgaben, die du gern machst: ${joinDe(likedTasks.map(t => TASK_TITLE[t] || t))}.`);
  if (dislikedTasks.length) learned.push(`Diese überspringst du oft, ich lasse sie weg: ${joinDe(dislikedTasks.map(t => TASK_TITLE[t] || t))}.`);
  if (fewerWakes) learned.push("In den Wachphasen bist du oft zu tief zum Antworten. Ich empfehle dir weniger Wachphasen.");
  if (favColor) learned.push(`Deine Farbe: ${favColor}. Sie taucht in deinen Sessions wieder auf.`);
  if (favWord) learned.push(`Dein Wort: „${favWord}“. Es kommt in der Verankerung wieder vor.`);
  if (goodPlaces.length) learned.push(`Wohlfühlorte, die passen: ${joinDe(goodPlaces.map(v => labelOf(PLACES, v)))}.`);
  if (badPlaces.length) learned.push(`Nicht ganz deins: ${joinDe(badPlaces.map(v => labelOf(PLACES, v)))}. Ich schlage dir andere Orte vor.`);
  if (likedPh.length) learned.push(`Trance-Erfahrungen, die bei dir wirken: ${joinDe(likedPh.map(v => labelOf(PHENOMENA, v)))}.`);
  if (weakPh.length) learned.push(`Kaum gespürt: ${joinDe(weakPh.map(v => labelOf(PHENOMENA, v)))}.`);
  if (susceptible) learned.push("Beim Lider-Test bleiben deine Augen fast immer zu. Du bist gut empfänglich.");
  if (stressDrop != null) learned.push(stressDrop > 0 ? `Nach einer Session ist deine Anspannung im Schnitt um ${stressDrop.toFixed(1).replace(".", ",").replace(",0", "")} Punkte niedriger.` : "Deine Anspannung sinkt bisher kaum. Probier längere Sessions oder die Atem-Kopplung.");
  if (responder === "hoch") learned.push("Du sprichst stark auf Suggestionen an. Trance-Erfahrungen und Auslöser wirken bei dir besonders gut.");
  if (responder === "niedrig") learned.push("Trance ist eine Fähigkeit, die man üben kann. Ich leite dich mehr zur aktiven Vorstellung an und setze auf klare Wenn-dann-Pläne.");
  if (timeRatio && Math.abs(1 - timeRatio) >= 0.2) learned.push(timeRatio < 1 ? "In Trance vergeht für dich die Zeit schneller, als sie ist." : "In Trance dehnt sich für dich die Zeit.");

  const summary = [
    runs.length === 1 ? "Erfahrungen aus einer bisherigen Session" : `Erfahrungen aus ${runs.length} bisherigen Sessions`,
    depthAvg ? `Tiefe im Schnitt ${depthAvg.toFixed(1)} von 5` : "",
    moreDepth ? "darf tiefer gehen" : "",
    gentle ? "hat zuletzt vorzeitig aufgehört, braucht mehr Sicherheit" : "",
    likedPh.length ? `wirkt gut: ${likedPh.map(v => labelOf(PHENOMENA, v)).join(", ")}` : "",
    weakPh.length ? `kaum gespürt: ${weakPh.map(v => labelOf(PHENOMENA, v)).join(", ")}` : "",
    badPlaces.length ? `Orte, die nicht passten: ${badPlaces.map(v => labelOf(PLACES, v)).join(", ")}` : "",
    favColor ? `Lieblingsfarbe ${favColor}` : "", favWord ? `eigenes Wort „${favWord}“` : "",
    responder ? `Ansprechbarkeit auf Suggestionen: ${responder}` : "",
    stressDrop != null ? `Anspannung sinkt pro Session im Schnitt um ${stressDrop.toFixed(1)} Punkte (Skala 0 bis 10)` : "",
    Object.keys(wishes).length ? `Wünsche: ${Object.keys(wishes).join(", ")}` : ""
  ].filter(Boolean).join("; ");

  const b = best && best.x.answers || null;
  return {
    n: runs.length, moreDepth: !!moreDepth, gentle, fewerWakes, likedTasks, dislikedTasks, favColor, favWord,
    breath: breaths.length ? median(breaths) : 0, selfDepth: selfVals.length ? Math.round(median(selfVals)) : 0,
    likedPh, weakPh, experienced, badPlaces, goodPlaces, susceptible, depthAvg,
    prefill: b ? {
      sound: b.sound, visual: b.visual, pace: b.pace,
      minutes: minutesTop ? Number(minutesTop[0]) : undefined,
      interactions: b.interactions, wakeCycles: fewerWakes ? Math.min(1, b.wakeCycles || 0) : b.wakeCycles,
      tasks: likedTasks.filter(t => t !== "zahl" || (b.wakeCycles || 0) >= 2).slice(0, 3),
      phenomena: likedPh.length ? [...likedPh.slice(0, 3), "ueberraschung"] : undefined
    } : null,
    responder, stressDrop, calmMore: stressDrop != null && stressDrop <= 0,
    lastPlace: (runs[runs.length - 1].answers || {}).place, lastDeepener: (runs[runs.length - 1].answers || {}).deepener,
    learned, summary
  };
}

      const pm = seg.match(/(\d+(?:[.,]\d+)?)/);
      const cm = seg.match(/^\[\s*(?:CHECK|FRAGE|RÜCKFRAGE)\s+([^\]]+)\]$/i);
      const tm = seg.match(/^\[\s*(?:AUFGABE|TASK)\s+([^\]]+)\]$/i);
      if (cm) { const kind = normalizeCheckKind(cm[1]); if (kind) items.push({ type: "check", kind }); }
      else if (tm) { const kind = normalizeTaskKind(tm[1]); if (kind) items.push({ type: "task", kind }); }
      else if (/^\[\s*ATEM/i.test(seg)) items.push({ type: "breath" });
      else if (/^\[\s*SELBST/i.test(seg)) items.push({ type: "selfdepth" });
      else if (/PAUSE/i.test(seg) && pm) items.push({ type: "pause", secs: clamp(parseFloat(pm[1].replace(",", ".")) || 3, 1, 40) });
      else items.push({ type: "snap" });
      return;
    }
    seg = seg.trim();
    if (!seg) return;
    const pieces = seg.split(/\s*(?:…|\.{3,})\s*/);
    pieces.forEach((piece, j) => {
      piece = piece.trim();
      if (piece) for (const s of sentencesOf(piece)) if (/[\p{L}\p{N}]/u.test(s)) items.push({ type: "speech", text: s });
      if (j < pieces.length - 1 && piece) items.push({ type: "pause", secs: 1.2, micro: true });
    });
  });
  return items;
}

function guessDepth(title, idx, n) {
  const t = title.toLowerCase();
  if (/wachphase|kurz wach|wake phase|briefly awake/.test(t)) return 1;
  if (/tiefer als zuvor|wieder tief|zurück in die tiefe|deeper than before|back into (the )?depth/.test(t)) return 8;
  if (/schlaf|sleep/.test(t) && idx >= n - 2) return 10;
  if (/rückkehr|aufwach|zurück|abschluss|nachsorge|ende\b|\breturn|wak(e|ing) up|coming back|aftercare|closing|\bend\b/.test(t)) return 0;
  if (/ankommen|begrüßung|einstieg|start|vorgespräch/.test(t)) return 1;
  if (/einleitung|entspann|körper|muskel|augen|fixation|blitz|überladung|verwirrung|einstimmung|erinnerte/.test(t)) return 3;
  if (/vertief|treppe|aufzug|zähl|countdown|wolke|pfad|fraktion/.test(t)) return 6;
  if (/ort|strand|wald|garten|see\b|wiese|hütte|stern/.test(t)) return 7;
  if (/anker|verank|sätze|suggest/.test(t)) return 8;
  if (/zukunft|alltag|ausklang/.test(t)) return 5;
  return 9;
}

function parseScript(src) {
  const sections = [];
  const items = [];
  let cur = -1;
  const ensure = () => {
    if (cur < 0) { sections.push({ title: "Session", depth: null }); cur = 0; items.push({ type: "heading", sec: 0, text: "Session" }); }
  };
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  for (const raw of lines) {
    let line = raw.trim();
    if (!line || /^```/.test(line)) continue;
    line = line.replace(/^\*\*(.+)\*\*$/, "$1");
    const m = line.match(/^#{1,6}\s*(.+)$/);
    if (m) {
      let title = m[1].trim();
      let depth = null;
      const d = title.match(/\(\s*(?:Tiefe|Depth)\s*[:=]?\s*(\d+(?:[.,]\d+)?)\s*\)\s*$/i);
      if (d) { depth = clamp(parseFloat(d[1].replace(",", ".")), 0, 10); title = title.slice(0, d.index).trim(); }
      title = title.replace(/[*_`]+/g, "").replace(/[:–—-]\s*$/, "").trim() || "Abschnitt";
      sections.push({ title, depth });
      cur = sections.length - 1;
      items.push({ type: "heading", sec: cur, text: title });
      continue;
    }
    if (/^\[\s*LEISER\s*\]$/i.test(line)) { ensure(); items.push({ type: "quieter", sec: cur }); continue; }
    line = line
      .replace(/^\s*(?:[-*•–]|\d+[.)])\s+/, "")
      .replace(/\*\*|__|\*/g, "")
      .replace(/\[(?!\s*(?:PAUSE|SNAP|SCHNIPS|CHECK|FRAGE|RÜCKFRAGE|AUFGABE|TASK|ATEM|SELBST))[^\]]*\]/gi, "")
      .trim();
    if (!line) continue;
    ensure();
    for (const it of lineToItems(line)) { it.sec = cur; items.push(it); }
  }
  sections.forEach((s, i) => { if (s.depth == null) s.depth = guessDepth(s.title, i, sections.length); });
  return { sections, items };
}

function parseFragment(src) {
  return parseScript(src).items.filter(it => it.type !== "heading");
}

function scriptWordCount(src) {
  return String(src || "")
    .split("\n")
    .filter(l => !/^\s*#/.test(l))
    .join(" ")
    .replace(/\[[^\]]*\]/g, " ")
    .split(/\s+/)
    .filter(w => /[\p{L}]/u.test(w)).length;
}

const ENDING_HEAD_RE = /rückkehr|aufwach|zurück(?! in die tiefe)|in den schlaf|nachsorge|\breturn|wak(e|ing) up|coming back|into sleep|aftercare/i;

function hasProperEnding(src) {
  const parts = String(src || "").split(/\n(?=\s*#)/);
  const heads = parts.map(p => (p.match(/^\s*#.*$/m) || [""])[0].toLowerCase());
  let i = heads.length - 1;
  if (i < 0 || !ENDING_HEAD_RE.test(heads[i])) return false;
  let words = 0;
  while (i >= 0 && ENDING_HEAD_RE.test(heads[i])) { words += scriptWordCount(parts[i]); i--; }
  return words >= 25;
}

const TTS = {
  ok: typeof window !== "undefined" && "speechSynthesis" in window && typeof window.SpeechSynthesisUtterance === "function",
  voices: [],
  listeners: new Set(),
  unlocked: false,
  current: null,
  init() {
    if (!this.ok) return;
    const load = () => {
      let v = [];
      try { v = window.speechSynthesis.getVoices() || []; } catch (e) { v = []; }
      if (v.length && v.length !== this.voices.length) { this.voices = v; this.listeners.forEach(f => { try { f(); } catch (e) {} }); }
    };
    load();
    try { window.speechSynthesis.addEventListener("voiceschanged", load); } catch (e) { window.speechSynthesis.onvoiceschanged = load; }
    [300, 1000, 2500].forEach(t => setTimeout(load, t));
  },
  lang: "de",
  loc() { return this.lang === "en" ? "en-US" : "de-DE"; },
  german() { const rx = this.lang === "en" ? /^en([-_]|$)/i : /^de([-_]|$)/i; return this.voices.filter(v => rx.test(v.lang || "")); },
  score(v) {
    const n = `${v.name || ""} ${v.voiceURI || ""}`;
    let s = 0;
    if (/premium|enhanced|erweitert|neural|natural|wavenet|studio/i.test(n)) s += 4;
    if (/google/i.test(n)) s += 2.5;
    if (/siri/i.test(n)) s += 2;
    if (/anna|helena|petra|markus|yannick|martin|katja|conrad|amala|seraphina|florian|vicki|hedda|stefan|marlene|samantha|serena|daniel|karen|moira|ava|allison|susan|aria|jenny|libby|sonia|ryan|guy/i.test(n)) s += 1;
    if ((this.lang === "en" ? /en-(US|GB)/i : /de-DE/i).test(v.lang || "")) s += 0.5;
    if (v.localService) s += 0.3;
    if (v.default) s += 0.2;
    if (/eloquence|compact|espeak|grandma|grandpa|rocko|shelley|flo\b|reed|sandy|eddy|oma|opa/i.test(n)) s -= 3;
    return s;
  },
  ranked() { return this.german().slice().sort((a, b) => this.score(b) - this.score(a)); },
  pick(uri) {
    if (uri && uri !== "auto" && uri !== "none") {
      const v = this.voices.find(x => x.voiceURI === uri);
      if (v && this.german().includes(v)) return v;
    }
    return this.ranked()[0] || null;
  },
  unlock() {
    if (!this.ok || this.unlocked) return;
    try {
      const u = new SpeechSynthesisUtterance(" ");
      u.volume = 0; u.lang = this.loc();
      window.speechSynthesis.speak(u);
      this.unlocked = true;
    } catch (e) {}
  },
  cancel() { if (this.ok) { try { window.speechSynthesis.cancel(); } catch (e) {} } },
  speak(text, o) {
    return new Promise(resolve => {
      if (!this.ok) { resolve({ ok: false, ms: 0 }); return; }
      let u;
      try { u = new SpeechSynthesisUtterance(text); } catch (e) { resolve({ ok: false, ms: 0 }); return; }
      if (o.voice) { u.voice = o.voice; u.lang = o.voice.lang; } else u.lang = this.loc();
      u.rate = o.rate; u.pitch = o.pitch; u.volume = o.volume;
      const t0 = performance.now();
      let done = false;
      const fin = (ok) => { if (done) return; done = true; clearTimeout(wd); resolve({ ok, ms: performance.now() - t0 }); };
      const wd = setTimeout(() => fin(false), (text.length / (7 * Math.max(0.4, o.rate))) * 1000 + 8000);
      u.onend = () => fin(true);
      u.onerror = () => fin(false);
      this.current = u;
      try {
        if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        window.speechSynthesis.speak(u);
      } catch (e) { fin(false); }
    });
  }
};

            d[i] = last * 3.5;

        for (let i = 0; i < fade; i++) { const g = i / fade; d[i] *= g; d[len - 1 - i] *= g; }

    if (this.metroTimer) { clearInterval(this.metroTimer); this.metroTimer = null; }
    if (this.fireTimer) { clearInterval(this.fireTimer); this.fireTimer = null; }
    this.metro = null; this.fire = null;
    const old = this.nodes, oldBus = this.bus;
    this.nodes = []; this.bus = null; this.padFilter = null; this.binR = null;
    if (!oldBus) { old.forEach(n => { try { n.stop(); } catch (e) {} }); return; }
    const t = this.ctx.currentTime;
    oldBus.gain.cancelScheduledValues(t);
    oldBus.gain.setTargetAtTime(0, t, Math.max(0.05, fade / 3));
    setTimeout(() => {
      old.forEach(n => { try { n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} });
      try { oldBus.disconnect(); } catch (e) {}
    }, fade * 1000 + 400);
  },
  setVolume(v) {
    this.vol = v;
    if (this.ctx && this.active) this.master.gain.setTargetAtTime(this.level(), this.ctx.currentTime, 0.25);
  },
  duck(on) {
    if (!this.ctx || !this.active) return;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(on ? 0 : this.level(), t, on ? 0.35 : 0.8);
  },
  fadeOut(sec) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.active = false;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(0, t, Math.max(0.1, sec / 4));
    const myBus = this.bus;
    setTimeout(() => { if (!this.active && this.bus === myBus) this.clear(0.1); }, sec * 1000 + 300);
  },
  setDepth(d, instant) {
    this.depth = d;
    if (!this.ctx) return;
    const t = this.ctx.currentTime, tc = instant ? 0.05 : 6;
    if (this.padFilter) this.padFilter.frequency.setTargetAtTime(1150 - d * 55, t, tc);
    if (this.binR) this.binR.frequency.setTargetAtTime(this.carrier + this.beatFor(d), t, tc);
  }
};

/* ---------- Player ---------- */
const BASE_CPS = 14.5;
const GAP = 0.9;
const HEAD_GAP = 1.6;

class Player {
  constructor(session, settings, hooks) {
    this.session = session;
    const sl = (session.lang || (session.answers && session.answers.lang)) === "en" ? "en" : "de";
    if (typeof SLANG !== "undefined") SLANG = sl;
    TTS.lang = sl;
    const parsed = parseScript(session.script);
    this.items = parsed.items;
    this.sections = parsed.sections;
    this.settings = settings;
    this.hooks = hooks || {};
    this.idx = 0;
    this.state = "idle";
    this.token = 0;
    this.cps = BASE_CPS;
    this.done = 0;
    this.played = 0;
    this.itemStart = 0;
    this.volFactor = 1;
    this.fit = 1;
    this.timer = null;
    this.waitRes = null;
    this.after = null;
    this.target = (Number(session.minutes) || 0) * 60;
    this.ctx = makeCtx(session.answers || {}, session.evaluation || null);
    this.log = [];
    this.vars = {};
    this.askedOnce = false;
    this.listening = false;
    this.taps = 0;
    this.tapTimes = [];
    this.minTapGap = 0;
    this.lastTapAt = 0;
    this.taskOpen = false;
    this.taskRes = null;
    this.breathPeriod = 0;
    this.forceWake = false;
    if (!this.items.some(it => it.type === "check")) this.insertDefaultChecks();
    this.ctx.wakeUsed = this.items.some(it => it.type === "task");
    this.recalc();
  }
  /* Für Skripte ohne Rückfrage-Marker (ältere Sessions, Claude ohne Marker) */
  insertDefaultChecks() {
    const secs = this.sections;
    const startOf = (i) => this.items.findIndex(it => it.type === "heading" && it.sec === i);
    const endOf = (i) => { const n = startOf(i + 1); return n < 0 ? this.items.length : n; };
    const plan = [];
    const sleep = this.session.ending === "schlaf";
    const deep = secs.findIndex(sct => sct.depth >= 5);
    if (deep >= 0) plan.push({ at: endOf(deep), kind: "tiefe", sec: deep });
    const ort = secs.findIndex(sct => /wohlfühl|ort\b|strand|wald|garten|see\b|wiese|hütte|stern|platz/i.test(sct.title));
    if (ort >= 0 && ort !== deep) plan.push({ at: endOf(ort), kind: "ort", sec: ort });
    const core = secs.findIndex(sct => sct.depth >= 9);
    if (core >= 0 && (Number(this.session.minutes) || 0) >= 20) plan.push({ at: startOf(core) + 1, kind: "ok", sec: core });
    if (!sleep) {
      const anch = secs.findIndex(sct => /verank|anker/i.test(sct.title));
      if (anch >= 0) plan.push({ at: endOf(anch), kind: "gefuehl", sec: anch });
      let last = -1;
      secs.forEach((sct, i) => { if (/rückkehr|aufwach|zurück(?! in die tiefe)|\breturn|wak(e|ing) up|coming back/i.test(sct.title)) last = i; });
      if (last > 0) plan.push({ at: startOf(last), kind: "bereit", sec: last - 1 });
    }
    plan.forEach((pl, i) => { pl.ord = i; });
    plan.sort((a, b) => (b.at - a.at) || (b.ord - a.ord)).forEach(pl => { if (pl.at >= 0) this.items.splice(pl.at, 0, { type: "check", kind: pl.kind, sec: pl.sec, auto: true }); });
  }
  interactiveOn() { return this.settings.interactive !== "aus"; }
  checksOn(kind) {
    if (CHECK_LEVEL[kind] === "extra") return this.interactiveOn();
    const lv = this.settings.feedback || "normal";
    if (lv === "aus") return false;
    if (lv === "wenig") return CHECK_LEVEL[kind] === "wenig";
    return true;
  }
  get mode() { return (this.settings.voice === "none" || !TTS.ok) ? "prompter" : "voice"; }
  get asmr() { return !!this.settings.asmr; }
  get rateEff() { return this.settings.rate * (this.asmr ? 0.92 : 1); }
  get pauseEff() { return this.settings.pauseFactor; }
  get gapScale() { return Math.min(this.fit, 1.6) * this.pauseEff; }
  get pauseScale() { return this.fit * this.pauseEff; }
  speechDur(it) { return it.text.length / (this.cps * this.rateEff) + 0.15; }
  parts(it) {
    if (it.type === "speech") return [this.speechDur(it), GAP, 0];
    if (it.type === "pause") return it.micro ? [0, it.secs, 0] : [0, 0, it.secs];
    if (it.type === "heading") return [0, HEAD_GAP, 0];
    if (it.type === "snap") return [0.7, 0, 0];
    if (it.type === "check") return [this.checksOn(it.kind) ? ({ lider: 26, ideo2: 24 }[it.kind] || 14) : 0, 0, 0];
    if (it.type === "task") return [this.interactiveOn() ? (TASK_EST[it.kind] || 24) : 0, 0, 0];
    if (it.type === "breath") return [this.interactiveOn() ? ((Number(this.session.minutes) || 20) <= 10 ? 42 : 52) : 24, 0, 0];
    if (it.type === "selfdepth") return [this.interactiveOn() ? ((Number(this.session.minutes) || 20) <= 10 ? 28 : 40) : (this.checksOn("tiefe") ? 34 : 20), 0, 0];
    return [0, 0, 0];
  }
  recalc() {
    let fixed = 0, gaps = 0, pauses = 0;
    for (let i = this.idx; i < this.items.length; i++) { const [a, g, q] = this.parts(this.items[i]); fixed += a; gaps += g; pauses += q; }
    if (this.target > 0 && gaps + pauses > 0) {
      const avail = this.target - this.done - fixed;
      let f = avail / (gaps + pauses);
      if (f > 1.6 && pauses > 0) f = (avail - gaps * 1.6) / pauses;
      const maxFit = this.target >= 60 * 60 ? 4.5 : this.target >= 45 * 60 ? 4 : this.target >= 30 * 60 ? 3 : 2.4;
      const minFit = this.target <= 10 * 60 ? 0.5 : 0.6;
      this.fit = clamp(f, minFit, maxFit);
    } else this.fit = 1;
  }
  estDur(it) { const [a, g, q] = this.parts(it); return a + g * this.gapScale + q * this.pauseScale; }
  timeline() {
    let t = 0;
    const secs = this.sections.map(s => ({ name: s.title, depth: s.depth, t0: null, t1: null }));
    this.items.forEach((it, i) => {
      if (it.type === "heading" && secs[it.sec]) secs[it.sec].t0 = t;
      t += (i < this.idx && it.actual != null) ? it.actual : this.estDur(it);
    });
    secs.forEach((s, i) => { s.t1 = (secs[i + 1] && secs[i + 1].t0 != null) ? secs[i + 1].t0 : t; if (s.t0 == null) s.t0 = s.t1; });
    return { total: t, sections: secs };
  }
  position() {
    const live = this.state === "playing" ? (performance.now() - this.itemStart) / 1000 : 0;
    const cur = this.items[this.idx];
    const cap = cur ? this.estDur(cur) * 1.5 + 2 : 0;
    return this.done + Math.min(live, cap);
  }
  currentSection() { const it = this.items[Math.min(this.idx, this.items.length - 1)]; return it ? it.sec : 0; }
  wait(sec, token) {
    return new Promise(res => {
      if (token !== this.token || sec <= 0) { res(); return; }
      this.waitRes = res;
      this.timer = setTimeout(() => { this.timer = null; this.waitRes = null; res(); }, sec * 1000);
    });
  }
  cancelWait() {
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    if (this.waitRes) { const r = this.waitRes; this.waitRes = null; r(); }
  }
  voiceObj() { return TTS.pick(this.settings.voice); }
  /* Platzhalter aus den Aufgaben ({WORT}, {FARBE}); {?ZAHL} = Satz nur, wenn es die Zahl gab */
  fill(text) {
    if (!/\{\??[A-Z]+\}/.test(text)) return text;
    let ok = true;
    const out = text.replace(/\{(\??)([A-Z]+)\}/g, (m, q, k) => {
      const v = this.vars[k];
      if (v == null || v === "") { ok = false; return ""; }
      return q ? "" : String(v);
    });
    return ok ? out.replace(/\s{2,}/g, " ").trim() : null;
  }
  async say(it, token) {
    if (this.mode === "prompter") { await this.wait(this.speechDur(it), token); return { ok: true, ms: 0 }; }
    return TTS.speak(it.text, {
      voice: this.voiceObj(),
      rate: this.rateEff,
      pitch: clamp(this.settings.pitch * (this.asmr ? 0.94 : 1), 0.5, 2),
      volume: clamp(this.settings.voiceVol * this.volFactor * (this.asmr ? 0.72 : 1), 0.05, 1)
    });
  }
  /* Kurze Ansagen der Mitmach-Elemente sprechen; stop() bricht vorzeitig ab */
  async speakLines(frag, token, stop) {
    for (const sub of frag) {
      if (token !== this.token) return false;
      if (stop && stop()) return true;
      if (sub.type === "speech") {
        if (this.hooks.onItem) this.hooks.onItem(sub);
        if (this.hooks.onSpeak) this.hooks.onSpeak(true, sub);
        await this.say(sub, token);
        if (this.hooks.onSpeak) this.hooks.onSpeak(false, sub);
        await this.wait(0.35, token);
      } else if (sub.type === "pause") {
        await this.wait(sub.secs <= 2 ? Math.min(sub.secs, 1.5) : sub.secs * this.pauseEff, token);
      } else if (sub.type === "snap") {
        Ambient.snap(clamp(this.settings.voiceVol, 0.3, 1));
        await this.wait(0.7, token);
      }
    }
    return token === this.token;
  }
  insertAfter(it, frag) {
